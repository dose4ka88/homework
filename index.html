<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Космическая Лего-Академия Саввы 🚀🧱</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #0F172A;
      --card-bg: rgba(255, 255, 255, 0.96);
      --lego-red: #EF4444;
      --lego-blue: #3B82F6;
      --lego-yellow: #F59E0B;
      --lego-green: #10B981;
      --lego-purple: #8B5CF6;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow-lego: 0 6px 0px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--bg-space);
      /* Космический фон с легким паттерном звезд */
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 80px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      color: var(--text-main);
      padding: 16px;
      max-width: 1050px;
      margin: 0 auto;
    }

    /* Шапка в стиле Космической Лего-Академии */
    .hero-header {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
      border: 4px solid #6366F1;
      color: white;
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    /* Эффект выступов Лего-кирпичиков сверху шапки */
    .hero-header::before {
      content: '🔴 🟡 🔵 🟢 🟣 🟡 🔴';
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 6px;
      opacity: 0.7;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 1000;
      margin-top: 8px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* Панель синхронизации */
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lego);
      border-bottom: 4px solid #CBD5E1;
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 800;
    }

    .btn-refresh {
      background: var(--lego-yellow);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0px #D97706;
      transition: all 0.1s ease;
    }

    .btn-refresh:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0px #D97706;
    }

    /* Переключатель вкладок в виде Лего-модулей */
    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: #1E293B;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid #334155;
    }

    .tab-btn.active {
      background: var(--lego-blue);
      color: white;
      border-color: #60A5FA;
      box-shadow: 0 6px 0px #1D4ED8;
      transform: translateY(-2px);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Карточки предметов (Группировка по предметам) */
    .subject-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 3px solid #E2E8F0;
      position: relative;
    }

    .subject-header {
      font-size: 20px;
      font-weight: 1000;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 2px dashed #E2E8F0;
    }

    .subject-title-text {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0px #CBD5E1;
    }

    .task-item:hover {
      border-color: var(--lego-blue);
      transform: translateY(-1px);
    }

    .task-checkbox {
      width: 26px;
      height: 26px;
      accent-color: var(--lego-green);
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .task-date-badge {
      font-size: 11px;
      font-weight: 900;
      background: #E2E8F0;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .task-text {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.4;
    }

    /* Выполненный Лего-модуль */
    .task-item.completed {
      background: #ECFDF5;
      border-color: #6EE7B7;
      box-shadow: 0 3px 0px #A7F3D0;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #065F46;
      opacity: 0.75;
    }

    .task-item.completed::after {
      content: '🧩 Модуль собран!';
      font-size: 11px;
      font-weight: 900;
      color: var(--lego-green);
      margin-left: auto;
      align-self: center;
      white-space: nowrap;
    }

    /* Сетка расписания */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      border: 3px solid #E2E8F0;
      display: flex;
      flex-direction: column;
    }

    .day-card.is-tomorrow {
      border-color: var(--lego-yellow);
      background: #FFFBEB;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
      transform: translateY(-2px);
    }

    .day-header {
      font-size: 17px;
      font-weight: 900;
      color: var(--lego-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tomorrow-badge {
      background: var(--lego-yellow);
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 2px 0px #D97706;
    }

    .lesson-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lesson-item {
      padding: 8px 10px;
      background: #F8FAFC;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #E2E8F0;
    }

    .lesson-num {
      background: #DBEAFE;
      color: var(--lego-blue);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94A3B8;
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- Мотивирующий космический лего-баннер -->
  <header class="hero-header">
    <div class="hero-title">👨‍🚀 Лего-Академия Исследователя Саввы</div>
    <div class="hero-subtitle">
      <span>👨‍🔬 Миссия: Собираем знания и покоряем новые вершины!</span>
    </div>
  </header>

  <!-- Статус синхронизации -->
  <div class="sync-bar">
    <div class="last-update" id="lastUpdate">Связь с ЦУП...</div>
    <button class="btn-refresh" onclick="forceRefreshData()">🔄 Обновить данные</button>
  </div>

  <!-- Вкладки в стиле Лего -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('homeworkTab', this)">📚 Задания по предметам</button>
    <button class="tab-btn" onclick="switchTab('scheduleTab', this)">🎒 Расписание (Завтра в школу)</button>
  </div>

  <!-- Вкладка 1: Домашка (Группировка по предметам) -->
  <div id="homeworkTab" class="tab-content active">
    <div id="homeworkContainer">Загрузка космических заданий...</div>
  </div>

  <!-- Вкладка 2: Расписание -->
  <div id="scheduleTab" class="tab-content">
    <div id="scheduleContainer">Загрузка расписания уроков...</div>
  </div>

  <script>
    let appData = { schedule: [], homework: [] };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function forceRefreshData() {
      const btn = document.querySelector('.btn-refresh');
      btn.innerText = '⏳ Связь...';
      await loadData();
      btn.innerText = '🔄 Обновить данные';
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json не найден');
        appData = await response.json();
        
        document.getElementById('lastUpdate').innerText = 'ЦУП обновлён: ' + (appData.updatedAt || 'неизвестно');
        
        renderSchedule();
        renderHomeworkBySubjects();
      } catch (error) {
        console.error('Ошибка:', error);
        document.getElementById('homeworkContainer').innerHTML = 
          '<div class="empty-state">⚠️ Данные из таблицы ещё не поступали.<br>Нажмите кнопку «Обновить данные».</div>';
        document.getElementById('scheduleContainer').innerHTML = 
          '<div class="empty-state">⚠️ Ожидание сигнала от расписания...</div>';
      }
    }

    // Отрисовка домашки с СТРОГОЙ ГРУППИРОВКОЙ ПО ПРЕДМЕТАМ
    function renderHomeworkBySubjects() {
      const container = document.getElementById('homeworkContainer');
      if (!appData.homework || appData.homework.length === 0) {
        container.innerHTML = '<div class="empty-state">🎉 Все космические задания выполнены! Отдыхаем! 🚀</div>';
        return;
      }

      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      const grouped = {};

      // Группируем задания по названиям предметов
      appData.homework.forEach(dayBlock => {
        if (dayBlock.items) {
          dayBlock.items.forEach(item => {
            const sub = item.subject || 'Разное';
            if (!grouped[sub]) {
              grouped[sub] = {
                icon: item.icon || '📌',
                color: item.color || '#3B82F6',
                tasks: []
              };
            }
            grouped[sub].tasks.push({ ...item, date: dayBlock.date });
          });
        }
      });

      let html = '';
      for (const [subjectName, group] of Object.entries(grouped)) {
        html += `
          <div class="subject-card" style="border-top: 6px solid ${group.color};">
            <div class="subject-header">
              <div class="subject-title-text" style="color: ${group.color};">
                <span style="font-size:24px;">${group.icon}</span>
                <span>${subjectName}</span>
              </div>
              <span style="font-size:12px; font-weight:800; color:var(--text-muted);">
                Заданий: ${group.tasks.length}
              </span>
            </div>

            <div class="tasks-list">
              ${group.tasks.map(t => {
                const isChecked = !!savedState[t.id];
                return `
                  <div class="task-item ${isChecked ? 'completed' : ''}" onclick="toggleTask('${t.id}')">
                    <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')">
                    <div style="flex:1;">
                      <div class="task-date-badge">🗓️ ${t.date}</div>
                      <div class="task-text">${t.text}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    // Отрисовка расписания уроков
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="empty-state">Расписание пока не заполнялось</div>';
        return;
      }

      const daysOfWeek = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
      const todayIndex = new Date().getDay();
      let tomorrowIndex = (todayIndex + 1) % 7;
      if (tomorrowIndex === 0 || tomorrowIndex === 6) tomorrowIndex = 1; 

      const tomorrowName = daysOfWeek[tomorrowIndex].toLowerCase();

      let html = '<div class="schedule-grid">';
      appData.schedule.forEach(item => {
        const isTomorrow = item.day.toLowerCase().includes(tomorrowName);
        html += `
          <div class="day-card ${isTomorrow ? 'is-tomorrow' : ''}">
            <div class="day-header">
              <span>🗓️ ${item.day}</span>
              ${isTomorrow ? '<span class="tomorrow-badge">🎒 Собираем завтра</span>' : ''}
            </div>
            <ul class="lesson-list">
              ${item.lessons.map((lesson, idx) => `
                <li class="lesson-item">
                  <span class="lesson-num">${idx + 1}</span>
                  <span>${lesson}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function toggleTask(id) {
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      savedState[id] = !savedState[id];
      localStorage.setItem('hw_completed', JSON.stringify(savedState));
      renderHomeworkBySubjects();
    }

    loadData();
  </script>
</body>
</html>
