<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьный Дневник — Савва</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F0F4F8;
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --accent-green: #10B981;
      --accent-orange: #FF8A65;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 14px;
      max-width: 850px;
      margin: 0 auto;
    }

    /* Шапка */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 32px;
      font-weight: 900;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 4px;
    }

    /* Навигация по основным разделам */
    .tabs-nav {
      display: flex;
      gap: 10px;
      background: #E2E8F0;
      padding: 6px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 900;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.15);
      transform: translateY(-1px);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Горизонтальный скролл для расписания по дням */
    .horizontal-days-wrapper {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 8px 4px 20px 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .horizontal-days-wrapper::-webkit-scrollbar {
      height: 8px;
    }

    .horizontal-days-wrapper::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 10px;
    }

    .day-column {
      flex: 0 0 280px;
      scroll-snap-align: start;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 2px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .day-column.is-today {
      border-color: #6366F1;
      background: #F5F3FF;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.18);
    }

    .day-header {
      font-size: 20px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .today-badge {
      background: #6366F1;
      color: #FFF;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Список уроков */
    .lesson-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lesson-item {
      padding: 10px 14px;
      background: #F8FAFC;
      border-radius: 14px;
      font-weight: 800;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #E2E8F0;
    }

    .lesson-num {
      background: #EEF2FF;
      color: var(--primary);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Карточки домашнего задания */
    .hw-day-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 1px solid #E2E8F0;
    }

    /* Шкала прогресса */
    .progress-box {
      margin-bottom: 16px;
      background: #F1F5F9;
      border-radius: 12px;
      padding: 10px 14px;
    }

    .progress-text {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 10px;
      background: #CBD5E1;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      border-radius: 16px;
      background: #F8FAFC;
      border: 2px solid #F1F5F9;
      margin-bottom: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .task-item:hover {
      border-color: #CBD5E1;
      transform: translateY(-1px);
    }

    .task-checkbox {
      width: 28px;
      height: 28px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .task-details {
      flex: 1;
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 13px;
      margin-bottom: 6px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .task-text {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.45;
    }

    /* Выполненное задание */
    .task-item.completed {
      background: #F0FDF4;
      border-color: #86EFAC;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #166534;
      opacity: 0.7;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--text-muted);
      font-size: 18px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎈 Школьный Дневник</h1>
    <div class="last-update" id="lastUpdate">Синхронизация с таблицей...</div>
  </header>

  <!-- Навигация -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('homeworkTab', this)">📝 Домашка</button>
    <button class="tab-btn" onclick="switchTab('scheduleTab', this)">📅 Расписание</button>
  </div>

  <!-- Вкладка: Домашка -->
  <div id="homeworkTab" class="tab-content active">
    <div id="homeworkContainer">Загрузка заданий...</div>
  </div>

  <!-- Вкладка: Расписание -->
  <div id="scheduleTab" class="tab-content">
    <div id="scheduleContainer">Загрузка расписания...</div>
  </div>

  <script>
    let appData = { schedule: [], homework: [] };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('Файл не найден');
        appData = await response.json();
        
        document.getElementById('lastUpdate').innerText = 'Обновлено из таблицы: ' + (appData.updatedAt || 'неизвестно');
        
        renderSchedule();
        renderHomework();
      } catch (error) {
        console.error('Ошибка загрузки:', error);
        document.getElementById('homeworkContainer').innerHTML = '<div class="empty-state">⏳ Ожидание первой синхронизации из Google Таблицы...</div>';
        document.getElementById('scheduleContainer').innerHTML = '<div class="empty-state">⏳ Расписание загружается...</div>';
      }
    }

    // Отрисовка расписания (горизонтальная лента карточек)
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="empty-state">Расписание пока не заполнено</div>';
        return;
      }

      // Определяем день недели для подсветки "Сегодня"
      const daysOfWeek = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
      const todayName = daysOfWeek[new Date().getDay()].toLowerCase();

      let html = '<div class="horizontal-days-wrapper">';
      appData.schedule.forEach(item => {
        const isToday = item.day.toLowerCase().includes(todayName);
        html += `
          <div class="day-column ${isToday ? 'is-today' : ''}">
            <div class="day-header">
              <span>🗓️ ${item.day}</span>
              ${isToday ? '<span class="today-badge">Сегодня</span>' : ''}
            </div>
            <ul class="lesson-list">
              ${item.lessons.map((lesson, idx) => `
                <li class="lesson-item">
                  <span class="lesson-num">${idx + 1}</span>
                  <span>${lesson}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Отрисовка домашнего задания
    function renderHomework() {
      const container = document.getElementById('homeworkContainer');
      if (!appData.homework || appData.homework.length === 0) {
        container.innerHTML = '<div class="empty-state">Ура! На сегодня домашних заданий нет! ☀️</div>';
        return;
      }

      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');

      let html = '';
      appData.homework.forEach(dayBlock => {
        const totalTasks = dayBlock.items.length;
        let completedCount = 0;

        dayBlock.items.forEach(t => {
          if (savedState[t.id]) completedCount++;
        });

        const progressPercent = Math.round((completedCount / totalTasks) * 100);

        html += `
          <div class="hw-day-card">
            <div style="font-size:20px; font-weight:900; color: var(--primary); margin-bottom: 12px;">
              📌 ${dayBlock.date}
            </div>

            <!-- Интерактивный прогресс -->
            <div class="progress-box">
              <div class="progress-text">
                <span>Прогресс выполнения:</span>
                <span>${completedCount} из ${totalTasks} ${progressPercent === 100 ? '🎉 Готово!' : ''}</span>
              </div>
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
              </div>
            </div>

            <div class="tasks-list">
              ${dayBlock.items.map(t => {
                const isChecked = !!savedState[t.id];
                return `
                  <div class="task-item ${isChecked ? 'completed' : ''}" onclick="toggleTask('${t.id}')">
                    <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')">
                    <div class="task-details">
                      <div class="task-badge" style="color: ${t.color}; background:${t.color}1A;">
                        ${t.icon}${t.subject}
                      </div>
                      <div class="task-text">${t.text}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function toggleTask(id) {
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      savedState[id] = !savedState[id];
      localStorage.setItem('hw_completed', JSON.stringify(savedState));
      renderHomework();
    }

    loadData();
  </script>
</body>
</html>
