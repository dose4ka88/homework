<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник 1Б 🚀</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #0B0F19;
      --card-bg: rgba(255, 255, 255, 0.95);
      --lego-red: #EF4444;
      --lego-blue: #3B82F6;
      --lego-yellow: #F59E0B;
      --lego-green: #10B981;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow-lego: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }
    body { background-color: var(--bg-space); color: var(--text-main); padding: 20px 16px 50px 16px; max-width: 1050px; margin: 0 auto; }
    .hero-header {
      background: radial-gradient(circle at 50% 50%, #312E81 0%, #1E1B4B 60%, #0F172A 100%);
      border: 3px solid #6366F1; color: white; border-radius: var(--radius-lg);
      padding: 30px 20px; text-align: center; margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);
    }
    .hero-title { font-size: 32px; font-weight: 1000; margin-bottom: 8px; color: #FFF; }
    .sync-bar {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
      background: var(--card-bg); padding: 12px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-lego);
    }
    .btn-refresh { background: var(--lego-yellow); color: #000; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 900; cursor: pointer; }
    .tabs-nav { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 130px; padding: 12px 8px; border: none; background: rgba(30, 41, 59, 0.8); border-radius: 16px; font-size: 13px; font-weight: 900; color: #94A3B8; cursor: pointer; }
    .tab-btn.active { background: var(--lego-blue); color: white; box-shadow: 0 4px 0px #1D4ED8; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .hw-day-block { background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .subject-card { background: #FFFFFF; padding: 16px; border-radius: var(--radius-md); margin-bottom: 14px; border-left: 6px solid var(--lego-blue); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .task-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F8FAFC; border: 2px solid #E2E8F0; margin-bottom: 8px; cursor: pointer; }
    .task-checkbox { width: 22px; height: 22px; accent-color: var(--lego-green); cursor: pointer; }
    .task-item.completed { background: #ECFDF5; border-color: #6EE7B7; text-decoration: line-through; opacity: 0.7; }
    .schedule-grid, .resources-grid, .events-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .day-card, .announcement-card, .resource-card, .event-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; border: 3px solid #E2E8F0; margin-bottom: 14px; }
    .section-title { font-size: 20px; font-weight: 1000; color: #FFFFFF; margin: 20px 0 14px 0; }
    .empty-state { text-align: center; padding: 40px; color: #94A3B8; font-weight: 800; background: var(--card-bg); border-radius: var(--radius-lg); }
  </style>
</head>
<body>

  <div class="hero-header">
    <div class="hero-title">Мой дневник 1Б 🚀</div>
  </div>

  <div class="sync-bar">
    <div id="lastUpdate" style="font-weight: 800; font-size: 13px;">Загрузка...</div>
    <button class="btn-refresh" onclick="loadData()">🔄 Обновить</button>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('homeworkTab', this)">📝 Домашка</button>
    <button class="tab-btn" onclick="switchTab('scheduleTab', this)">🎒 Расписание</button>
    <button class="tab-btn" onclick="switchTab('announceTab', this)">📢 Объявления</button>
    <button class="tab-btn" onclick="switchTab('eventsTab', this)">🎂 События</button>
  </div>

  <div id="homeworkTab" class="tab-content active">
    <div id="homeworkContainer">Загрузка заданий...</div>
  </div>

  <div id="scheduleTab" class="tab-content">
    <div id="scheduleContainer">Загрузка расписания...</div>
  </div>

  <div id="announceTab" class="tab-content">
    <div class="section-title">📢 Объявления</div>
    <div id="announcementsContainer"></div>
    <div class="section-title">🔗 Полезные ресурсы</div>
    <div class="resources-grid" id="resourcesContainer"></div>
  </div>

  <div id="eventsTab" class="tab-content">
    <div class="section-title">🎂 События и Дни рождения</div>
    <div id="eventsContainer"></div>
  </div>

  <script>
    let appData = { schedule: [], homework: [], announcements: [], resources: [], events: [] };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function loadData() {
      try {
        const res = await fetch('data.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error('Не удалось загрузить data.json');
        appData = await res.json();
        document.getElementById('lastUpdate').innerText = 'Обновлено: ' + (appData.updatedAt || '');
        renderAll();
      } catch (e) {
        console.error(e);
        document.getElementById('lastUpdate').innerText = 'Ошибка загрузки данных';
      }
    }

    function renderAll() {
      renderHomework();
      renderSchedule();
      renderAnnouncements();
      renderResources();
      renderEvents();
    }

    function renderHomework() {
      const container = document.getElementById('homeworkContainer');
      if (!appData.homework || appData.homework.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет заданий</div>';
        return;
      }

      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      let html = '';

      appData.homework.forEach((dayBlock, dayIdx) => {
        const items = dayBlock.items || [];
        html += `
          <div class="hw-day-block">
            <h3 style="color:#3B82F6; margin-bottom:14px;">🗓️ ${dayBlock.date}</h3>
            ${items.map((item, itemIdx) => {
              const taskId = `hw_${dayIdx}_${itemIdx}`;
              const isDone = !!savedState[taskId];
              return `
                <div class="subject-card">
                  <div class="task-item ${isDone ? 'completed' : ''}" onclick="toggleTask('${taskId}')">
                    <input type="checkbox" class="task-checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${taskId}')">
                    <div style="font-weight: 800; font-size: 15px;">${item.text || item.subject}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function toggleTask(id) {
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      savedState[id] = !savedState[id];
      localStorage.setItem('hw_completed', JSON.stringify(savedState));
      renderHomework();
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="empty-state">Расписание не найдено</div>';
        return;
      }
      let html = '<div class="schedule-grid">';
      appData.schedule.forEach(day => {
        html += `
          <div class="day-card">
            <h3 style="color:#3B82F6; margin-bottom:10px;">🗓️ ${day.day}</h3>
            <ul style="list-style:none; display:flex; flex-direction:column; gap:6px;">
              ${(day.lessons || []).map((l, i) => `<li style="padding:8px; background:#F8FAFC; border-radius:8px; font-weight:800;"><b>${i + 1}.</b>${l}</li>`).join('')}
            </ul>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function renderAnnouncements() {
      const container = document.getElementById('announcementsContainer');
      if (!appData.announcements || appData.announcements.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет объявлений</div>';
        return;
      }
      container.innerHTML = appData.announcements.map(a => `
        <div class="announcement-card">
          <div style="font-size:12px; color:#64748B; font-weight:800;">📅 ${a.date}</div>
          <h3 style="margin:6px 0;">${a.title}</h3>
          <p style="color:#475569; font-weight:700;">${a.text}</p>
        </div>
      `).join('');
    }

    function renderResources() {
      const container = document.getElementById('resourcesContainer');
      if (!appData.resources || appData.resources.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет ресурсов</div>';
        return;
      }
      container.innerHTML = appData.resources.map(r => `
        <div class="resource-card">
          <a href="${r.url}" target="_blank" style="color:#3B82F6; font-weight:900; text-decoration:none;">${r.title} ↗</a>
          <p style="font-size:13px; color:#64748B; margin-top:4px;">${r.description}</p>
        </div>
      `).join('');
    }

    function renderEvents() {
      const container = document.getElementById('eventsContainer');
      if (!appData.events || appData.events.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет событий</div>';
        return;
      }
      container.innerHTML = appData.events.map(e => `
        <div class="event-card">
          <div style="font-size:28px;">${e.icon || '📌'}</div>
          <div style="font-size:12px; color:#64748B; font-weight:800; margin-top:4px;">📅 ${e.date}</div>
          <h3 style="margin:4px 0;">${e.name}</h3>
          <p style="font-size:13px; color:#475569;">${e.description}</p>
        </div>
      `).join('');
    }

    loadData();
  </script>
</body>
</html>
