      return head + `
        <div class="toolbar">
          <label class="search">${icon('search')}<input type="search" placeholder="${t.search}" value="${escapeHtml(MAT.q)}" oninput="setMatQuery(this.value)" aria-label="${t.search}"></label>
          <div class="seg">
            ${types.map(([k, l]) => `<button class="${MAT.type === k ? 'on' : ''}" onclick="MAT.type='${k}'; renderView('materials')">${l} <span class="n">${k === 'all' ? MATERIALS.length : MATERIALS.filter(m => m.kind === k).length}</span></button>`).join('')}
          </div>
          ${subjKeys.length > 1 ? `
            <div class="chips">
              <button class="chip ${MAT.subj === 'all' ? 'on' : ''}" onclick="MAT.subj='all'; renderView('materials')">${t.allSubjects}</button>
              ${subjKeys.map(k => `<button class="chip subj ${MAT.subj === k ? 'on' : ''}" ${subjAttr(k)} onclick="MAT.subj='${k}'; renderView('materials')"><span class="dot"></span>${escapeHtml(subjName(k, true))} <span class="n">${subjCounts[k]}</span></button>`).join('')}

    // ---------- Каникулы ----------
    function viewVacations() {
      const t = T();
      const today = startOfToday();
      const yStart = new Date(SCHOOL_YEAR_START + 'T00:00:00');
      const yEnd = new Date(VACATIONS_DATA[VACATIONS_DATA.length - 1].startDate + 'T00:00:00');
      const pct = Math.max(0, Math.min(100, Math.round((today - yStart) / (yEnd - yStart) * 100)));
      let nearestFound = false;

      const cards = VACATIONS_DATA.map(v => {
        const s = new Date(v.startDate + 'T00:00:00');
        const e = new Date(v.endDate + 'T23:59:59');
        let status, cls = '', isNearest = false;
        if (today >= s && today <= e) { status = t.vacationNow; isNearest = true; nearestFound = true; }
        else if (today < s) {
          status = t.daysLeft(dayDiff(s, today));
          if (!nearestFound) { isNearest = true; nearestFound = true; }
        } else { status = t.vacationPassed; cls = 'past'; }
        if (isNearest) cls = 'highlight';
        const range = `${formatDayMonth(s)} – ${formatDayMonth(new Date(v.endDate + 'T00:00:00'))}`;
        return `
          <div class="card ${cls}">
            <div class="item-row">
              <span class="emoji-tile">${v.icon}</span>
              <div class="grow">
                <div class="item-title">${v.title[currentLang]} ${isNearest ? `<span class="tag warn" style="margin-left:4px">${t.nearest}</span>` : ''}</div>
                <div class="item-sub">${range} · ${status}</div>
              </div>
              ${cls !== 'past' ? `<button class="icon-btn" onclick="addVacationToCalendar('${v.id}')" title="${t.btnCalendar}" aria-label="${t.btnCalendar}">${icon('calendarPlus')}</button>` : ''}
            </div>
          </div>`;
      }).join('');

      return pageHead(t.vacTitle, t.vacSub) + `<div class="narrow stack-lg">
        <div class="card">
          <div class="progress-label"><span>${t.yearProgress}</span><span>${pct}%</span></div>
          <div class="progress"><span style="width:${pct}%"></span></div>
        </div>
        <div class="list">${cards}</div>
      </div>`;
    }

    // ---------- События ----------
    function viewEvents() {
      const t = T();
      const head = pageHead(t.eventsTitle, t.eventsSub);
      if (!DATA_LOADED) return head + loadingOrError();
      EVENT_LIST = appData.events || [];
      const items = EVENT_LIST.map((e, i) => ({ e, i, n: daysUntilAnnual(e.date) })).filter(x => isFinite(x.n)).sort((a, b) => a.n - b.n);
      if (!items.length) return head + `<div class="empty narrow"><span class="big">🎈</span>${t.emptyEvents}</div>`;

      const today = startOfToday();
      let html = '', lastMonth = null;
      items.forEach((x, k) => {
        const d = new Date(today);
        d.setDate(d.getDate() + x.n);
        if (d.getMonth() !== lastMonth) {
          lastMonth = d.getMonth();
          html += `<div class="month-label">${t.monthsNom[lastMonth]}</div>`;
        }
        const nearest = k === 0;
        html += `
          <div class="card ${nearest ? 'highlight' : ''}" style="margin-bottom:10px">
            <div class="item-row">
              <span class="date-tile"><b>${d.getDate()}</b><span>${t.monthsShort[d.getMonth()]}</span></span>
              <div class="grow">
                <div class="item-title">${x.e.icon || '🎂'} ${escapeHtml(x.e.name || '')}</div>
                <div class="item-sub">${cap(t.inDays(x.n))}${x.e.description ? ' · ' + escapeHtml(x.e.description) : ''}</div>
                ${nearest ? `<span class="tag warn" style="margin-top:6px">⭐ ${t.congratulate}</span>` : ''}
              </div>
              <button class="icon-btn" onclick="addEventToCalendar(${x.i})" title="${t.btnCalendar}" aria-label="${t.btnCalendar}">${icon('calendarPlus')}</button>
            </div>
          </div>`;
      });
      return head + `<div class="narrow">${html}</div>`;
    }

    // ---------- Ещё (телефон) ----------
    function viewMore() {
      const t = T();
      const today = startOfToday();
      const vac = VACATIONS_DATA.find(v => new Date(v.endDate + 'T23:59:59') >= today);
      const vacSub = vac ? (dayDiff(new Date(vac.startDate + 'T00:00:00'), today) <= 0 ? t.vacNow(vac.title[currentLang]) : t.vacIn(vac.title[currentLang], dayDiff(new Date(vac.startDate + 'T00:00:00'), today))) : '';

    // =========================================================
    // РЕЖИМ УЧЕНИКА
    // =========================================================
    function kidHero(title, sub, right) {
      return `<div class="kid-hero"><div><h1>${title}</h1><p>${sub}</p></div>${right || ''}</div>`;
    }

    function viewKidTasks() {
      const t = T();
      const r = computeRewards();
      const hero = kidHero(t.kidHello, t.kidTasksSub, `<div class="star-pill">⭐ ${r.stars}</div>`);
      if (!DATA_LOADED) return hero + loadingOrError();

      const state = lsGetJSON('hw_completed');
      const days = homeworkDays().filter(d => !d.complete);
      if (!days.length) {
        return hero + `<div class="empty"><span class="big">🏆</span><div style="font-size:1.25rem;color:var(--text)">${t.kidAllDone}</div>${t.kidAllDoneSub}<br><button class="btn" onclick="navigate('kidPlay')">${t.kidGoPlay}</button></div>`;
      }

      return hero + days.map(d => `
        <div class="kid-day">🗓️ ${d.date ? cap(weekdayName(d.date)) + ', ' + formatDayMonth(d.date) : escapeHtml(d.block.date || '')}</div>
        ${d.tasks.map(task => {
          const done = !!state[task.id];
          const text = displayTaskText(task.sub.text);
          SPEAK_TEXTS[task.id] = `${subjName(task.sub.subj)}. ${text}`;
          const related = findRelatedMaterials(task.sub.text).filter(m => m.kind === 'video' || m.kind === 'game').slice(0, 3);
          return `
            <div class="kid-task subj ${done ? 'done' : ''}" ${subjAttr(task.sub.subj)}>
              <div class="kid-task-top">
                <span class="kid-emoji">${subjDef(task.sub.subj).icon}</span>
                <div style="min-width:0">
                  <div class="kid-subj">${escapeHtml(subjName(task.sub.subj))}</div>
                  <div class="kid-text">${richText(text)}</div>
                </div>
              </div>
              <div class="kid-actions">
                <button class="kid-btn primary" onclick="toggleTask('${task.id}', ${task.dayIndex})">${done ? t.kidUndo : '✅ ' + t.kidDone}</button>
                <button class="kid-btn kid-speak ${speakingId === task.id ? 'on' : ''}" data-speak="${task.id}" onclick="speakTask('${task.id}')"><span class="speak-ic">${icon(speakingId === task.id ? 'stop' : 'volume')}</span> ${t.kidListen}</button>
                ${related.map(m => `<a class="kid-btn" href="${m.url}" target="_blank" rel="noopener">${m.kind === 'video' ? '📺' : '🎮'} ${escapeHtml(matTitle(m))}</a>`).join('')}
              </div>
            </div>`;
        }).join('')}`).join('');
    }

    function viewKidPlay() {
      const t = T();
      const hero = kidHero(t.kidPlayTitle, t.kidPlaySub);
      if (!DATA_LOADED) return hero + loadingOrError();
      const all = MATERIALS.filter(m => m.kind === 'game' || m.kind === 'video');
      if (!all.length) return hero + `<div class="empty"><span class="big">🎮</span>${t.kidNoPlay}</div>`;
      const subjKeys = Object.keys(SUBJECTS).filter(k => all.some(m => m.subj === k));
      if (KID_SUBJ !== 'all' && !subjKeys.includes(KID_SUBJ)) KID_SUBJ = 'all';
      const list = all.filter(m => KID_SUBJ === 'all' || m.subj === KID_SUBJ);
      return hero + `
        ${subjKeys.length > 1 ? `<div class="chips kid-chips">
          <button class="chip ${KID_SUBJ === 'all' ? 'on' : ''}" onclick="KID_SUBJ='all'; renderView('kidPlay')">⭐ ${t.typeAll}</button>
          ${subjKeys.map(k => `<button class="chip subj ${KID_SUBJ === k ? 'on' : ''}" ${subjAttr(k)} onclick="KID_SUBJ='${k}'; renderView('kidPlay')">${subjDef(k).icon} ${escapeHtml(subjName(k, true))}</button>`).join('')}
        </div>` : ''}
        <div class="kid-grid">
          ${list.map(m => `
            <a class="kid-tile subj" ${subjAttr(m.subj)} href="${m.url}" target="_blank" rel="noopener">
              ${m.yt ? `<img src="https://img.youtube.com/vi/${m.yt}/mqdefault.jpg" alt="" loading="lazy">` : `<span class="e">${m.kind === 'game' ? '🎮' : '📺'}</span>`}
              <span class="t">${escapeHtml(matTitle(m))}</span>
              <span class="s">${subjDef(m.subj).icon} ${escapeHtml(subjName(m.subj, true))}</span>
            </a>`).join('')}
        </div>`;
    }

    function viewKidStars() {
      const t = T();
      const r = computeRewards();
      return kidHero(t.kidStarsTitle, t.kidStarsSub) + `
        <div class="kid-stats">
          <div class="kid-stat"><b>⭐ ${r.stars}</b><span>${t.stars}</span></div>
          <div class="kid-stat"><b>🔥 ${r.streak}</b><span>${t.streak}</span></div>
          <div class="kid-stat"><b>✅ ${r.completedDays}</b><span>${t.daysDone}</span></div>
        </div>
        <div class="medals">
          ${MEDALS.map(m => {
            const got = r.completedDays >= m.days;
            return `<div class="medal ${got ? 'got' : 'locked'}"><div class="e">${m.icon}</div><b>${t.medalDays(m.days)}</b><span>${got ? t.medalGot : t.medalLeft(m.days - r.completedDays)}</span></div>`;
          }).join('')}
        </div>`;
    }

    // =========================================================
    // ЗАПУСК
    // =========================================================
    const VIEW_RENDER = {
      home: viewHome, homework: viewHomework, schedule: viewSchedule, news: viewNews, materials: viewMaterials,
      vacations: viewVacations, events: viewEvents, more: viewMore, settings: viewSettings,
      kidTasks: viewKidTasks, kidPlay: viewKidPlay, kidStars: viewKidStars
    };

    document.documentElement.lang = currentLang;
    applyTheme();
    applyRoute();
    loadData();
  </script>
</body>
</html>
