<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник Успехов Саввы 🚀</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F4F7FB;
      --card-bg: #FFFFFF;
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --accent-green: #10B981;
      --accent-orange: #F97316;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-sm: 0 4px 14px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 24px rgba(79, 70, 229, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Мотивирующая шапка */
    .hero-header {
      background: linear-gradient(135deg, #6366F1 0%, #4338CA 100%);
      color: white;
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
      position: relative;
    }

    .hero-title {
      font-size: 24px;
      font-weight: 1000;
      margin-bottom: 4px;
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 800;
      opacity: 0.95;
      background: rgba(255, 255, 255, 0.18);
      display: inline-block;
      padding: 4px 12px;
      border-radius: 10px;
    }

    /* Панель синхронизации */
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 800;
    }

    .btn-refresh {
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background: var(--primary);
      color: white;
    }

    /* Вкладки */
    .tabs-nav {
      display: flex;
      gap: 10px;
      background: #E2E8F0;
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* СЕТКА РАСПИСАНИЯ НА ОДНОМ ЭКРАНЕ */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 2px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }

    /* Подсветка "Завтра в школу" */
    .day-card.is-tomorrow {
      border-color: #F97316;
      background: #FFF7ED;
      box-shadow: 0 8px 24px rgba(249, 115, 22, 0.2);
      transform: translateY(-2px);
    }

    .day-header {
      font-size: 17px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tomorrow-badge {
      background: #F97316;
      color: #FFF;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lesson-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lesson-item {
      padding: 8px 10px;
      background: #F8FAFC;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #E2E8F0;
    }

    .day-card.is-tomorrow .lesson-item {
      background: #FFFFFF;
      border-color: #FFEDD5;
    }

    .lesson-num {
      background: #EEF2FF;
      color: var(--primary);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Карточки домашнего задания */
    .filter-panel {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .filter-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #E2E8F0;
      background: #F8FAFC;
      font-weight: 800;
      font-size: 14px;
      outline: none;
    }

    .hw-day-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid #E2E8F0;
    }

    .progress-box {
      margin-bottom: 14px;
      background: #F1F5F9;
      border-radius: 10px;
      padding: 10px 14px;
    }

    .progress-text {
      font-size: 13px;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-bar-bg {
      height: 8px;
      background: #CBD5E1;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 8px;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      background: #F8FAFC;
      border: 2px solid #F1F5F9;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .task-checkbox {
      width: 24px;
      height: 24px;
      accent-color: var(--accent-green);
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .task-details {
      flex: 1;
    }

    .task-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 900;
      font-size: 12px;
      margin-bottom: 4px;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .task-text {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.4;
    }

    .task-item.completed {
      background: #F0FDF4;
      border-color: #86EFAC;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #166534;
      opacity: 0.7;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <!-- Мотивирующий заголовок -->
  <header class="hero-header">
    <div class="hero-title">🚀 Савва, ты настоящий исследователь!</div>
    <div class="hero-subtitle">Каждый день — это шаг к новым успехам 🌟</div>
  </header>

  <!-- Статус синхронизации -->
  <div class="sync-bar">
    <div class="last-update" id="lastUpdate">Загрузка данных...</div>
    <button class="btn-refresh" onclick="forceRefreshData()">🔄 Обновить данные</button>
  </div>

  <!-- Вкладки -->
  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('homeworkTab', this)">📝 Домашка</button>
    <button class="tab-btn" onclick="switchTab('scheduleTab', this)">📅 Расписание уроков</button>
  </div>

  <!-- Вкладка: Домашка -->
  <div id="homeworkTab" class="tab-content active">
    <div class="filter-panel">
      <select class="filter-select" id="viewMode" onchange="renderHomework()">
        <option value="byDate">📅 По дням</option>
        <option value="bySubject">📚 По предметам</option>
      </select>
      <select class="filter-select" id="subjectFilter" onchange="renderHomework()">
        <option value="all">Все предметы</option>
      </select>
    </div>
    <div id="homeworkContainer">Загрузка заданий...</div>
  </div>

  <!-- Вкладка: Расписание -->
  <div id="scheduleTab" class="tab-content">
    <div id="scheduleContainer">Загрузка расписания...</div>
  </div>

  <script>
    let appData = { schedule: [], homework: [] };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function forceRefreshData() {
      const btn = document.querySelector('.btn-refresh');
      btn.innerText = '⏳ Загрузка...';
      await loadData();
      btn.innerText = '🔄 Обновить данные';
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json не найден');
        appData = await response.json();
        
        document.getElementById('lastUpdate').innerText = 'Синхронизировано: ' + (appData.updatedAt || 'неизвестно');
        
        populateSubjectFilter();
        renderSchedule();
        renderHomework();
      } catch (error) {
        console.error('Ошибка:', error);
        document.getElementById('homeworkContainer').innerHTML = 
          '<div class="empty-state">⚠️ Данные ещё не синхронизировались.<br>Проверь, создан ли файл <b>data.json</b> в репозитории на GitHub.</div>';
        document.getElementById('scheduleContainer').innerHTML = 
          '<div class="empty-state">⚠️ Ожидание синхронизации расписания...</div>';
      }
    }

    function populateSubjectFilter() {
      const select = document.getElementById('subjectFilter');
      const subjects = new Set();

      if (appData.homework) {
        appData.homework.forEach(day => {
          if (day.items) {
            day.items.forEach(item => { if (item.subject) subjects.add(item.subject); });
          }
        });
      }

      let options = '<option value="all">Все предметы</option>';
      subjects.forEach(sub => options += `<option value="${sub}">${sub}</option>`);
      select.innerHTML = options;
    }

    // Отрисовка расписания (СЕТКА НА ОДНОМ ЭКРАНЕ + ПОДСВЕТКА "ЗАВТРА")
    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="empty-state">Расписание пока не заполнено в Google Таблице</div>';
        return;
      }

      // Вычисляем завтрашний день недели
      const daysOfWeek = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
      const todayIndex = new Date().getDay();
      // Если сегодня пятница (5) или суббота (6), завтрашний школьный день — понедельник
      let tomorrowIndex = (todayIndex + 1) % 7;
      if (tomorrowIndex === 0 || tomorrowIndex === 6) tomorrowIndex = 1; 

      const tomorrowName = daysOfWeek[tomorrowIndex].toLowerCase();

      let html = '<div class="schedule-grid">';
      appData.schedule.forEach(item => {
        const isTomorrow = item.day.toLowerCase().includes(tomorrowName);
        html += `
          <div class="day-card ${isTomorrow ? 'is-tomorrow' : ''}">
            <div class="day-header">
              <span>🗓️ ${item.day}</span>
              ${isTomorrow ? '<span class="tomorrow-badge">🎒 Завтра в школу</span>' : ''}
            </div>
            <ul class="lesson-list">
              ${item.lessons.map((lesson, idx) => `
                <li class="lesson-item">
                  <span class="lesson-num">${idx + 1}</span>
                  <span>${lesson}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Отрисовка домашнего задания
    function renderHomework() {
      const container = document.getElementById('homeworkContainer');
      if (!appData.homework || appData.homework.length === 0) {
        container.innerHTML = '<div class="empty-state">Ура! На сегодня домашних заданий нет! 🎉</div>';
        return;
      }

      const viewMode = document.getElementById('viewMode').value;
      const selectedSubject = document.getElementById('subjectFilter').value;
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');

      if (viewMode === 'byDate') {
        let html = '';
        appData.homework.forEach(dayBlock => {
          const filteredItems = (dayBlock.items || []).filter(i => selectedSubject === 'all' || i.subject === selectedSubject);
          if (filteredItems.length === 0) return;

          const totalTasks = filteredItems.length;
          let completedCount = 0;
          filteredItems.forEach(t => { if (savedState[t.id]) completedCount++; });
          const progressPercent = Math.round((completedCount / totalTasks) * 100);

          html += `
            <div class="hw-day-card">
              <div style="font-size:18px; font-weight:900; color: var(--primary); margin-bottom: 10px;">
                📌 ${dayBlock.date}
              </div>

              <div class="progress-box">
                <div class="progress-text">
                  <span>Выполнено заданий:</span>
                  <span>${completedCount} из ${totalTasks} ${progressPercent === 100 ? '🎉 Молодец!' : ''}</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${progressPercent}%;"></div>
                </div>
              </div>

              <div class="tasks-list">
                ${filteredItems.map(t => renderTaskHTML(t, savedState)).join('')}
              </div>
            </div>
          `;
        });
        container.innerHTML = html || '<div class="empty-state">Нет заданий по выбранному предмету</div>';
      } else {
        // По предметам
        const grouped = {};
        appData.homework.forEach(dayBlock => {
          (dayBlock.items || []).forEach(item => {
            if (selectedSubject !== 'all' && item.subject !== selectedSubject) return;
            if (!grouped[item.subject]) {
              grouped[item.subject] = { icon: item.icon, color: item.color, tasks: [] };
            }
            grouped[item.subject].tasks.push({ ...item, date: dayBlock.date });
          });
        });

        let html = '';
        for (const [subName, group] of Object.entries(grouped)) {
          html += `
            <div class="hw-day-card" style="border-left: 5px solid ${group.color}">
              <div style="font-size:18px; font-weight:900; color: ${group.color}; margin-bottom: 10px;">
                ${group.icon} ${subName}
              </div>
              <div class="tasks-list">
                ${group.tasks.map(t => `
                  <div style="font-size: 12px; font-weight: 800; color: var(--text-muted); margin: 6px 0 2px 0;">
                    🗓️ ${t.date}
                  </div>
                  ${renderTaskHTML(t, savedState)}
                `).join('')}
              </div>
            </div>
          `;
        }
        container.innerHTML = html || '<div class="empty-state">Нет заданий по выбранному предмету</div>';
      }
    }

    function renderTaskHTML(t, savedState) {
      const isChecked = !!savedState[t.id];
      return `
        <div class="task-item ${isChecked ? 'completed' : ''}" onclick="toggleTask('${t.id}')">
          <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')">
          <div class="task-details">
            <div class="task-badge" style="color: ${t.color}; background: ${t.color}1A;">
              ${t.icon} ${t.subject}
            </div>
            <div class="task-text">${t.text}</div>
          </div>
        </div>
      `;
    }

    function toggleTask(id) {
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      savedState[id] = !savedState[id];
      localStorage.setItem('hw_completed', JSON.stringify(savedState));
      renderHomework();
    }

    loadData();
  </script>
</body>
</html>
