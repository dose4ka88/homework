<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Космическая Лего-Академия Саввы 🚀🧱</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-space: #0F172A;
      --card-bg: rgba(255, 255, 255, 0.96);
      --lego-red: #EF4444;
      --lego-blue: #3B82F6;
      --lego-yellow: #F59E0B;
      --lego-green: #10B981;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow-lego: 0 6px 0px rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
    }

    body {
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      color: var(--text-main);
      padding: 16px;
      max-width: 1050px;
      margin: 0 auto;
    }

    .hero-header {
      background: linear-gradient(135deg, #1E1B4B 0%, #312E81 50%, #4338CA 100%);
      border: 4px solid #6366F1;
      color: white;
      border-radius: var(--radius-lg);
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 1000;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lego);
      border-bottom: 4px solid #CBD5E1;
    }

    .last-update {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 800;
    }

    .btn-refresh {
      background: var(--lego-yellow);
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 0px #D97706;
      transition: all 0.1s ease;
    }

    .btn-refresh:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0px #D97706;
    }

    .tabs-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: #1E293B;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      color: #94A3B8;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid #334155;
    }

    .tab-btn.active {
      background: var(--lego-blue);
      color: white;
      border-color: #60A5FA;
      box-shadow: 0 6px 0px #1D4ED8;
      transform: translateY(-2px);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .filter-panel {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      box-shadow: var(--shadow-lego);
    }

    .filter-label {
      font-size: 14px;
      font-weight: 900;
      color: var(--text-main);
    }

    .filter-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #CBD5E1;
      font-weight: 800;
      font-size: 14px;
      outline: none;
      background: #F8FAFC;
    }

    .subject-section {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border: 3px solid #E2E8F0;
    }

    .subject-title {
      font-size: 22px;
      font-weight: 1000;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 3px dashed #E2E8F0;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #F8FAFC;
      border: 2px solid #E2E8F0;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 3px 0px #CBD5E1;
    }

    .task-item:hover {
      border-color: var(--lego-blue);
      transform: translateY(-1px);
    }

    .task-checkbox {
      width: 26px;
      height: 26px;
      accent-color: var(--lego-green);
      cursor: pointer;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .task-date-badge {
      font-size: 12px;
      font-weight: 900;
      background: #DBEAFE;
      color: var(--lego-blue);
      padding: 3px 10px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .task-text {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.45;
    }

    .task-item.completed {
      background: #ECFDF5;
      border-color: #6EE7B7;
      box-shadow: 0 3px 0px #A7F3D0;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: #065F46;
      opacity: 0.75;
    }

    .task-item.completed::after {
      content: '🧩 Модуль собран!';
      font-size: 11px;
      font-weight: 900;
      color: var(--lego-green);
      margin-left: auto;
      align-self: center;
      white-space: nowrap;
    }

    /* СЕТКА РАСПИСАНИЯ */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      border: 3px solid #E2E8F0;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
    }

    /* ЯРКОЕ ЗЕЛЕНОЕ СИЯНИЕ "ЗАВТРА В ШКОЛУ" */
    .day-card.is-next-school-day {
      border: 4px solid #10B981 !important;
      background: #F0FDF4 !important;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6), 0 8px 20px rgba(16, 185, 129, 0.3) !important;
      transform: translateY(-4px);
    }

    /* ПОДСВЕТКА СЕГОДНЯШНЕГО ДНЯ */
    .day-card.is-today {
      border: 3px solid #3B82F6 !important;
      background: #EFF6FF !important;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.4) !important;
    }

    .day-header {
      font-size: 18px;
      font-weight: 900;
      color: var(--lego-blue);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px;
    }

    .next-day-badge {
      background: #10B981;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 1000;
      padding: 4px 10px;
      border-radius: 8px;
      box-shadow: 0 2px 0px #059669;
      letter-spacing: 0.3px;
      animation: pulseGreen 2s infinite;
    }

    .today-badge {
      background: #3B82F6;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 6px;
    }

    @keyframes pulseGreen {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .lesson-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lesson-item {
      padding: 8px 10px;
      background: #F8FAFC;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #E2E8F0;
    }

    .lesson-num {
      background: #DBEAFE;
      color: var(--lego-blue);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .pack-checklist-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      border: 3px solid var(--lego-yellow);
    }

    .pack-title {
      font-size: 19px;
      font-weight: 1000;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .pack-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #F8FAFC;
      border-radius: 12px;
      border: 2px solid #E2E8F0;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .pack-item.checked {
      background: #ECFDF5;
      border-color: #6EE7B7;
      text-decoration: line-through;
      color: #065F46;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94A3B8;
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <header class="hero-header">
    <div class="hero-title">👨‍🚀 Лего-Академия Исследователя Саввы</div>
    <div class="hero-subtitle">
      <span>👨‍🔬 Миссия: Собираем знания и готовимся к школьным успехам!</span>
    </div>
  </header>

  <div class="sync-bar">
    <div class="last-update" id="lastUpdate">Связь с ЦУП...</div>
    <button class="btn-refresh" onclick="forceRefreshData()">🔄 Обновить данные</button>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('homeworkTab', this)">📚 Задания по предметам</button>
    <button class="tab-btn" onclick="switchTab('scheduleTab', this)">🎒 Расписание и Портфель</button>
  </div>

  <!-- Вкладка: Домашка -->
  <div id="homeworkTab" class="tab-content active">
    <div class="filter-panel">
      <span class="filter-label">Период заданий:</span>
      <select class="filter-select" id="periodFilter" onchange="renderHomeworkBySubjects()">
        <option value="current">📅 Актуальные задания</option>
        <option value="all">📜 Показать все (включая прошлые)</option>
        <option value="uncompleted">⏳ Только невыполненные</option>
      </select>
    </div>
    <div id="homeworkContainer">Загрузка космических заданий...</div>
  </div>

  <!-- Вкладка: Расписание -->
  <div id="scheduleTab" class="tab-content">
    <div id="scheduleContainer">Загрузка расписания уроков...</div>

    <div class="pack-checklist-card">
      <div class="pack-title">
        <span>🎒 Вечерний Лего-Чеклист: Собираем портфель в школу</span>
      </div>
      <div class="pack-grid" id="packChecklistGrid"></div>
    </div>
  </div>

  <script>
    let appData = { schedule: [], homework: [] };

    const PACK_ITEMS = [
      { id: 'p_lunch', text: '🍱 Ланчбокс с перекусом' },
      { id: 'p_water', text: '💧 Бутылочка с водой' },
      { id: 'p_pencils', text: '✏️ Поточить карандаши' },
      { id: 'p_books', text: '📚 Проверить учебники и тетради' },
      { id: 'p_form', text: '👕 Проверить школьную форму' },
      { id: 'p_sport', text: '👟 Спортивная форма (если Физкультура)' }
    ];

    // Ключевые слова для определения дней недели в болгарской, русской и английской раскладке
    const DAY_MAP = {
      0: ['неделя', 'воскресенье', 'sunday'],
      1: ['понеделник', 'понедельник', 'monday', 'пн'],
      2: ['вторник', 'tuesday', 'вт'],
      3: ['сряда', 'среда', 'wednesday', 'ср'],
      4: ['четвъртък', 'четверг', 'thursday', 'чт'],
      5: ['петък', 'пятница', 'friday', 'пт'],
      6: ['събота', 'суббота', 'saturday', 'сб']
    };

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function forceRefreshData() {
      const btn = document.querySelector('.btn-refresh');
      btn.innerText = '⏳ Связь...';
      await loadData();
      btn.innerText = '🔄 Обновить данные';
    }

    async function loadData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json не найден');
        appData = await response.json();
        
        document.getElementById('lastUpdate').innerText = 'ЦУП обновлён: ' + (appData.updatedAt || 'неизвестно');
        
        renderSchedule();
        renderHomeworkBySubjects();
        renderPackChecklist();
      } catch (error) {
        console.error('Ошибка:', error);
        document.getElementById('homeworkContainer').innerHTML = 
          '<div class="empty-state">⚠️ Данные из таблицы ещё не поступали. Нажмите кнопку «Обновить данные».</div>';
        document.getElementById('scheduleContainer').innerHTML = 
          '<div class="empty-state">⚠️ Ожидание сигнала от расписания...</div>';
      }
    }

    function formatPrettyDate(rawDateStr) {
      if (!rawDateStr) return '';
      const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
      
      const match = rawDateStr.match(/(\d{1,2})[\.\/](\d{1,2})/);
      if (match) {
        const dayNum = parseInt(match[1], 10);
        const monthNum = parseInt(match[2], 10) - 1;
        const monthName = months[monthNum] || '';
        
        let dayOfWeek = '';
        const parts = rawDateStr.split(/[-–—]/);
        if (parts.length > 1) {
          dayOfWeek = parts[parts.length - 1].trim();
        }

        return `${dayNum} ${monthName}${dayOfWeek ? ', ' + dayOfWeek : ''}`;
      }
      return rawDateStr;
    }

    function renderHomeworkBySubjects() {
      const container = document.getElementById('homeworkContainer');
      if (!appData.homework || appData.homework.length === 0) {
        container.innerHTML = '<div class="empty-state">🎉 Все космические задания выполнены! Отдыхаем! 🚀</div>';
        return;
      }

      const periodFilter = document.getElementById('periodFilter').value;
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      const grouped = {};

      appData.homework.forEach(dayBlock => {
        if (dayBlock.items) {
          dayBlock.items.forEach(item => {
            const sub = item.subject || 'Другие предметы';
            const isDone = !!savedState[item.id];

            if (periodFilter === 'uncompleted' && isDone) return;

            if (!grouped[sub]) {
              grouped[sub] = {
                icon: item.icon || '📌',
                color: item.color || '#3B82F6',
                tasks: []
              };
            }
            grouped[sub].tasks.push({ ...item, prettyDate: formatPrettyDate(dayBlock.date) });
          });
        }
      });

      let html = '';
      for (const [subjectName, group] of Object.entries(grouped)) {
        if (group.tasks.length === 0) continue;

        html += `
          <div class="subject-section" style="border-top: 6px solid ${group.color};">
            <div class="subject-title" style="color: ${group.color};">
              <span style="font-size:28px;">${group.icon}</span>
              <span>${subjectName}</span>
            </div>

            <div class="tasks-list">
              ${group.tasks.map(t => {
                const isChecked = !!savedState[t.id];
                return `
                  <div class="task-item ${isChecked ? 'completed' : ''}" onclick="toggleTask('${t.id}')">
                    <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')">
                    <div style="flex:1;">
                      <div class="task-date-badge">🗓️ ${t.prettyDate}</div>
                      <div class="task-text">${t.text}</div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      container.innerHTML = html || '<div class="empty-state">В этом разделе пока нет заданий! 👍</div>';
    }

    // Проверка совпадения дня карточки с нужным днем недели
    function matchesDay(cardDayText, dayIndex) {
      const text = cardDayText.toLowerCase();
      const keywords = DAY_MAP[dayIndex] || [];
      return keywords.some(kw => text.includes(kw));
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="empty-state">Расписание пока не заполнялось</div>';
        return;
      }

      const todayIndex = new Date().getDay(); // 0 = воскресенье
      
      // Вычисляем следующий школьный день (если суббота 6 или воскресенье 0 -> то понедельник 1)
      let nextSchoolIndex = (todayIndex + 1) % 7;
      if (nextSchoolIndex === 0 || nextSchoolIndex === 6) {
        nextSchoolIndex = 1; // Понедельник
      }

      let html = '<div class="schedule-grid">';
      appData.schedule.forEach(item => {
        const isToday = matchesDay(item.day, todayIndex);
        const isNextDay = matchesDay(item.day, nextSchoolIndex);

        let cardClass = '';
        if (isNextDay) cardClass = 'is-next-school-day';
        else if (isToday) cardClass = 'is-today';

        html += `
          <div class="day-card ${cardClass}">
            <div class="day-header">
              <span>🗓️ ${item.day}</span>
              ${isNextDay ? '<span class="next-day-badge">🎒 Собираем завтра</span>' : ''}
              ${isToday && !isNextDay ? '<span class="today-badge">Сегодня</span>' : ''}
            </div>
            <ul class="lesson-list">
              ${item.lessons.map((lesson, idx) => `
                <li class="lesson-item">
                  <span class="lesson-num">${idx + 1}</span>
                  <span>${lesson}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function renderPackChecklist() {
      const grid = document.getElementById('packChecklistGrid');
      const packState = JSON.parse(localStorage.getItem('pack_completed') || '{}');

      let html = '';
      PACK_ITEMS.forEach(item => {
        const isChecked = !!packState[item.id];
        html += `
          <div class="pack-item ${isChecked ? 'checked' : ''}" onclick="togglePackItem('${item.id}')">
            <input type="checkbox" class="task-checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); togglePackItem('${item.id}')">
            <span>${item.text}</span>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function toggleTask(id) {
      const savedState = JSON.parse(localStorage.getItem('hw_completed') || '{}');
      savedState[id] = !savedState[id];
      localStorage.setItem('hw_completed', JSON.stringify(savedState));
      renderHomeworkBySubjects();
    }

    function togglePackItem(id) {
      const packState = JSON.parse(localStorage.getItem('pack_completed') || '{}');
      packState[id] = !packState[id];
      localStorage.setItem('pack_completed', JSON.stringify(packState));
      renderPackChecklist();
    }

    loadData();
  </script>
</body>
</html>
