<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F3F5F9" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Хаб 1Б">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>Классный хаб 1Б</title>

  <!-- Тема, размер шрифта и режим применяются до отрисовки, чтобы страница не «мигала» -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('ui_theme') || 'auto';
        var font = localStorage.getItem('ui_font') || 'normal';
        var mode = localStorage.getItem('ui_mode') || 'parent';
        var dark = theme === 'dark' || (theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var c = document.documentElement.classList;
        if (dark) c.add('dark');
        if (font === 'large') c.add('font-large');
        if (mode === 'kid') c.add('kid');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* =========================================================
       ДИЗАЙН-ТОКЕНЫ
       ========================================================= */
    :root {
      --bg: #F3F5F9;
      --surface: #FFFFFF;
      --surface-2: #F5F7FB;
      --surface-3: #EAEEF5;
      --border: #E2E7EF;
      --border-strong: #CBD3DF;

      --text: #0B1220;
      --text-2: #475467;
      --text-3: #6B7689;

      --primary: #111827;
      --on-primary: #FFFFFF;
      --link: #4338CA;

      --success: #16A34A;
      --success-soft: #E7F7EC;
      --success-ink: #15803D;
      --danger: #DC2626;
      --danger-soft: #FDECEC;
      --warn: #F59E0B;
      --warn-soft: #FEF5DC;
      --warn-ink: #92400E;

      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 20px rgba(16, 24, 40, 0.05);
      --shadow-lg: 0 18px 50px rgba(16, 24, 40, 0.18);

      --r-lg: 20px;
      --r: 14px;
      --r-sm: 10px;

      --sidebar-w: 260px;
      --nav-h: 64px;

      color-scheme: light;
    }

    html.dark {
      --bg: #0A0F1A;
      --surface: #111827;
      --surface-2: #172033;
      --surface-3: #1F2A3F;
      --border: #222D42;
      --border-strong: #354258;

      --text: #EEF2F8;
      --text-2: #B6C0D0;
      --text-3: #8793A7;

      --primary: #F1F5F9;
      --on-primary: #0B1220;
      --link: #A5B4FC;

      --success: #22C55E;
      --success-soft: rgba(34, 197, 94, 0.14);
      --success-ink: #4ADE80;
      --danger: #F87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --warn: #FBBF24;
      --warn-soft: rgba(251, 191, 36, 0.13);
      --warn-ink: #FCD34D;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 18px 50px rgba(0, 0, 0, 0.6);

      color-scheme: dark;
    }

    html { font-size: 16px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html.font-large { font-size: 18px; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    html.kid body { font-family: 'Nunito', 'Manrope', system-ui, sans-serif; }

    button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    a { color: var(--link); }
    img { display: block; max-width: 100%; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--link) 55%, transparent); outline-offset: 2px; border-radius: 8px; }

    .icon {
      width: 1.25rem; height: 1.25rem; flex-shrink: 0;
      stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .icon.sm { width: 1rem; height: 1rem; }
    .icon.lg { width: 1.5rem; height: 1.5rem; }

    /* Цвета предметов: --sc (основной), --sc-dark (для тёмной темы), --sc-ink (цвет текста) */
    .subj {
      --c: var(--sc);
      --ink: var(--sc-ink, var(--sc));
      --soft: color-mix(in srgb, var(--sc) 12%, transparent);
    }
    html.dark .subj {
      --c: var(--sc-dark);
      --ink: var(--sc-dark);
      --soft: color-mix(in srgb, var(--sc-dark) 17%, transparent);
    }

    /* =========================================================
       КАРКАС: боковое меню (компьютер) / верхняя и нижняя панели (телефон)
       ========================================================= */
    .sidebar { display: none; }

    .appbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      background: color-mix(in srgb, var(--bg) 86%, transparent);
      backdrop-filter: saturate(1.6) blur(14px);
      -webkit-backdrop-filter: saturate(1.6) blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.0625rem; letter-spacing: -0.01em; min-width: 0; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
      background: linear-gradient(135deg, #2563EB 0%, #1E3A8A 100%);
      color: #FFFFFF; display: grid; place-items: center; font-weight: 800; font-size: 0.9rem;
      position: relative; overflow: hidden;
    }
    .brand-logo::after { content: ''; position: absolute; left: 9px; right: 9px; bottom: 6px; height: 3px; border-radius: 2px; background: #FBBF24; }
    .brand-sub { font-size: 0.75rem; font-weight: 600; color: var(--text-3); }

    .appbar-actions { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: inline-grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    .pill-btn {
      height: 40px; padding: 0 14px; border-radius: 12px;
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 700; font-size: 0.875rem;
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
    }

    .main {
      max-width: 1180px; margin: 0 auto;
      padding: 6px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    .bottom-nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: flex;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: saturate(1.6) blur(16px);
      -webkit-backdrop-filter: saturate(1.6) blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .bn-item {
      flex: 1; height: var(--nav-h); position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 0.6875rem; font-weight: 700; color: var(--text-3);
    }
    .bn-icon { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background 0.2s; }
    .bn-item.active { color: var(--text); }
    .bn-item.active .bn-icon { background: var(--surface-3); }
    .bn-badge {
      position: absolute; top: 6px; left: calc(50% + 8px);
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--danger); color: #FFFFFF; font-size: 0.6875rem; font-weight: 800;
      display: grid; place-items: center; border: 2px solid var(--surface);
    }

    @media (min-width: 900px) {
      .appbar, .bottom-nav { display: none; }
      .sidebar {
        display: flex; flex-direction: column; gap: 6px;
        position: fixed; top: 0; bottom: 0; left: 0; width: var(--sidebar-w); z-index: 30;
        padding: 22px 14px 18px;
        background: var(--surface); border-right: 1px solid var(--border);
        overflow-y: auto;
      }
      .main-wrap { margin-left: var(--sidebar-w); }
      .main { padding: 34px 40px 56px; }
    }

    .side-brand { padding: 2px 8px 18px; }
    .side-nav { display: flex; flex-direction: column; gap: 2px; }
    .side-item {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 10px 12px; border-radius: 12px; text-align: left;
      font-weight: 700; font-size: 0.9375rem; color: var(--text-2);
      transition: background 0.15s, color 0.15s;
    }
    .side-item:hover { background: var(--surface-2); color: var(--text); }
    .side-item.active { background: var(--primary); color: var(--on-primary); }
    .side-item .badge-count { margin-left: auto; }
    .side-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .side-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.75rem; font-weight: 600; color: var(--text-3); padding: 0 4px; }

    /* =========================================================
       ОБЩИЕ ЭЛЕМЕНТЫ
       ========================================================= */
    .view { display: none; }
    .view.active { display: block; animation: viewIn 0.25s ease; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .page-head { margin: 10px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .eyebrow { font-size: 0.8125rem; font-weight: 700; color: var(--text-3); margin-bottom: 4px; }
    .title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
    .subtitle { color: var(--text-2); font-size: 0.9375rem; margin-top: 6px; }
    @media (min-width: 900px) { .title { font-size: 2.125rem; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow);
    }
    @media (min-width: 900px) { .card { padding: 20px; } }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .card-title { font-size: 1.0625rem; font-weight: 800; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; line-height: 1.3; }
    .card-sub { font-size: 0.8125rem; color: var(--text-3); font-weight: 600; margin-top: 2px; }

    .stack { display: flex; flex-direction: column; gap: 8px; }
    .stack-lg { display: flex; flex-direction: column; gap: 14px; }
    .muted { color: var(--text-3); }
    .small { font-size: 0.8125rem; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 18px; border-radius: 12px;
      font-weight: 700; font-size: 0.9375rem; text-decoration: none;
      background: var(--primary); color: var(--on-primary);
      transition: transform 0.1s, opacity 0.2s, background 0.15s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn.secondary { background: var(--surface-3); color: var(--text); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn.ghost:hover { background: var(--surface-2); opacity: 1; }
    .btn.sm { height: 36px; padding: 0 12px; font-size: 0.8125rem; border-radius: 10px; }
    .btn.block { width: 100%; }
    .btn.wa { background: #25D366; color: #FFFFFF; }
    .btn.viber { background: #7360F2; color: #FFFFFF; }

    .seg {
      display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px;
      background: var(--surface-3); max-width: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .seg::-webkit-scrollbar { display: none; }
    .seg button {
      height: 36px; padding: 0 14px; border-radius: 9px; white-space: nowrap;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-weight: 700; font-size: 0.875rem; color: var(--text-2);
    }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(16, 24, 40, 0.1); }
    .seg .n { font-size: 0.75rem; color: var(--text-3); font-weight: 700; }
    .seg.full { display: flex; width: 100%; }
    .seg.full button { flex: 1; padding: 0 8px; }

    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px; }
    .chips::-webkit-scrollbar { display: none; }
    @media (min-width: 900px) { .chips { flex-wrap: wrap; overflow: visible; } }
    .chip {
      height: 36px; padding: 0 13px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 7px;
      border: 1px solid var(--border); background: var(--surface);
      font-weight: 700; font-size: 0.8125rem; color: var(--text-2);
    }
    .chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
    .chip .n { opacity: 0.6; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--text-3)); flex-shrink: 0; }

    .badge-count {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
      background: var(--danger); color: #FFFFFF; font-size: 0.6875rem; font-weight: 800;
      display: inline-grid; place-items: center;
    }
    .new-chip {
      display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px;
      background: var(--danger); color: #FFFFFF; font-size: 0.625rem; font-weight: 800; letter-spacing: 0.04em;
    }
    .tag {
      display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 7px;
      font-size: 0.75rem; font-weight: 800; background: var(--soft, var(--surface-3)); color: var(--ink, var(--text-2));
    }
    .tag.danger { background: var(--danger-soft); color: var(--danger); }
    .tag.success { background: var(--success-soft); color: var(--success-ink); }
    .tag.warn { background: var(--warn-soft); color: var(--warn-ink); }

    .progress { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: 4px; background: var(--success); transition: width 0.4s ease; }
    .progress.warn > span { background: var(--warn); }
    .progress-label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.8125rem; font-weight: 700; color: var(--text-2); margin-bottom: 6px; }

    .row-link {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 12px; border-radius: 12px; text-align: left; text-decoration: none;
      background: var(--surface-2); color: var(--text); font-weight: 700; font-size: 0.9375rem;
      transition: background 0.15s;
    }
    .row-link:hover { background: var(--surface-3); }
    .row-link .grow { flex: 1; min-width: 0; }
    .row-link .sub { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-3); margin-top: 1px; }
    .row-link .chev { color: var(--text-3); }
    .row-emoji { width: 36px; height: 36px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 1.15rem; flex-shrink: 0; }

    .notice { display: flex; gap: 10px; align-items: center; padding: 11px 13px; border-radius: 12px; background: var(--warn-soft); color: var(--warn-ink); font-weight: 700; font-size: 0.875rem; }

    .empty {
      text-align: center; padding: 40px 20px; border-radius: var(--r-lg);
      background: var(--surface); border: 1px dashed var(--border-strong);
      color: var(--text-3); font-weight: 700;
    }
    .empty .big { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .empty .btn { margin-top: 14px; }

    .skeleton {
      border-radius: var(--r-lg); height: 150px; margin-bottom: 14px;
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%);
      background-size: 200% 100%; animation: shimmer 1.3s infinite linear;
    }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .rich { color: var(--text-2); font-size: 0.9375rem; line-height: 1.6; overflow-wrap: anywhere; }
    .rich b { color: var(--text); }
    .rich a { font-weight: 700; }

    /* =========================================================
       ГЛАВНАЯ
       ========================================================= */
    .home-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
    @media (min-width: 700px) { .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 1250px) { .home-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

    .lessons { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .lesson {
      display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px;
      background: var(--surface-2); font-weight: 700; font-size: 0.9375rem;
    }
    .lesson .num { width: 18px; text-align: center; color: var(--text-3); font-size: 0.8125rem; font-weight: 800; }
    .lesson .bar { width: 4px; height: 20px; border-radius: 2px; background: var(--c); flex-shrink: 0; }
    .lesson .name { flex: 1; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
    .lesson .emoji { font-size: 1rem; }

    .mini-tasks { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .mini-task { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 0.9375rem; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
    .mini-task .mark { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; color: transparent; flex-shrink: 0; }
    .mini-task.done .mark { background: var(--success); border-color: var(--success); color: #FFFFFF; }
    .mini-task.done .label { color: var(--text-3); text-decoration: line-through; }
    .mini-task .bar { width: 4px; height: 18px; border-radius: 2px; background: var(--c); }

    /* =========================================================
       ДОМАШКА
       ========================================================= */
    .hw-layout { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1100px) {
      .hw-layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
      .hw-aside { position: sticky; top: 28px; }
    }
    .hw-tools { margin-bottom: 18px; }

    .day-group { margin-bottom: 26px; }
    .day-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
    .day-title { font-weight: 800; font-size: 1.125rem; letter-spacing: -0.01em; }
    .day-sub { color: var(--text-3); font-size: 0.8125rem; font-weight: 600; }
    .day-prog { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; font-weight: 800; color: var(--text-2); flex-shrink: 0; }
    .day-prog .progress { width: 64px; }
    .day-group.done .day-prog { color: var(--success-ink); }

    .task {
      position: relative; overflow: hidden;
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 12px 14px 16px; margin-bottom: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
    }
    .task::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
    .check {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; margin-top: 1px;
      border: 2px solid var(--border-strong); color: transparent;
      display: grid; place-items: center; transition: all 0.15s;
    }
    .check:hover { border-color: var(--success); }
    .task.done .check { background: var(--success); border-color: var(--success); color: #FFFFFF; }
    .task-body { flex: 1; min-width: 0; cursor: pointer; }
    .task-subj { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 0.75rem; font-weight: 800; color: var(--ink); text-transform: uppercase; letter-spacing: 0.03em; }
    .task-text { font-size: 0.9375rem; line-height: 1.55; overflow-wrap: anywhere; }
    .task.done .task-text { color: var(--text-3); text-decoration: line-through; }
    .speak { width: 38px; height: 38px; border-radius: 11px; background: var(--surface-2); color: var(--text-2); display: grid; place-items: center; flex-shrink: 0; }
    .speak:hover { background: var(--surface-3); color: var(--text); }
    .speak.on { background: var(--primary); color: var(--on-primary); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  <script>
    // =========================================================
    // НАСТРОЙКИ, КОТОРЫЕ МОЖНО МЕНЯТЬ

    // Полезная информация на главной (звонки, контакты учителя, школа).

    //   { icon: '🔔', title: 'Звонки', value: '1 урок: 8:00–8:40', url: '' },
    //   { icon: '📞', title: 'Учитель', value: 'Имя, телефон', url: 'tel:+359...' },
    const USEFUL_INFO = [

    const VACATIONS_DATA = [
      { id: 'autumn', icon: '🍂', title: { ru: 'Осенние каникулы', bg: 'Есенна ваканция' }, startDate: '2026-10-31', endDate: '2026-11-02' },
      { id: 'christmas', icon: '🎄', title: { ru: 'Рождественские каникулы', bg: 'Коледна ваканция' }, startDate: '2026-12-24', endDate: '2027-01-03' },
      { id: 'midterm', icon: '❄️', title: { ru: 'Межсеместровый перерыв', bg: 'Междусрочна ваканция' }, startDate: '2027-01-30', endDate: '2027-02-02' },
      { id: 'spring', icon: '🌱', title: { ru: 'Весенние каникулы', bg: 'Пролетна ваканция' }, startDate: '2027-04-03', endDate: '2027-04-11' },
      { id: 'summer_start', icon: '☀️', title: { ru: 'Летние каникулы (1 класс)', bg: 'Лятна ваканция (1. клас)' }, startDate: '2027-06-02', endDate: '2027-08-31' }
    ];
    const SCHOOL_YEAR_START = '2026-09-15';

    // Цвета предметов. Математика — синий, Родинознание — жёлтый, БЕЛ — красный.
    // sc — основной цвет, dark — для тёмной темы, ink — цвет текста (жёлтый текст плохо читается на белом).
    const SUBJECTS = {
      bel:   { name: 'Български език и литература', short: 'БЕЛ', icon: '📖', sc: '#DC2626', dark: '#F87171' },
      math:  { name: 'Математика', short: 'Математика', icon: '🔢', sc: '#2563EB', dark: '#60A5FA' },
      rod:   { name: 'Родинознание', short: 'Родинознание', icon: '🌍', sc: '#EAB308', dark: '#FACC15', ink: '#A16207' },
      music: { name: 'Музика', short: 'Музика', icon: '🎵', sc: '#9333EA', dark: '#C084FC' },
      art:   { name: 'Изобразително изкуство', short: 'ИИ', icon: '🎨', sc: '#DB2777', dark: '#F472B6' },

      pe:    { name: 'Физическо възпитание и спорт', short: 'ФВС', icon: '⚽', sc: '#16A34A', dark: '#4ADE80' },
      eng:   { name: 'Английски език', short: 'Английски', icon: '🔤', sc: '#0891B2', dark: '#22D3EE' },
      cls:   { name: 'Час на класа', short: 'Час на класа', icon: '👩‍🏫', sc: '#64748B', dark: '#94A3B8' },
      other: { name: { ru: 'Общее', bg: 'Общо' }, short: { ru: 'Общее', bg: 'Общо' }, icon: '📌', sc: '#64748B', dark: '#94A3B8' }
    };

    // Как узнать предмет по тексту (домашка, урок, материал)
    const SUBJ_RULES = [
      ['pe', /физическ|фвс|спорт|физкулт/],
      ['cls', /час на класа/],
      ['eng', /английск|english/],
      ['bel', /(^|[^а-яё])бел(?![а-яё])|българск|буквар|четене|граматик|звук|букв|сричк|(^|[^а-яё])дум[аи]|изречени|диктовк|прочит/],
      ['math', /(^|[^а-яё])мат(?![а-яё])|математ|сборник|събиран|изваждан|числ|цифр|геометр|фигур|пчеличк/],
      ['rod', /родинозн|природ|сезон|годишн|растени|животн|празни/],
      ['music', /музик/],
      ['art', /изобразит|рисув/],
      ['tech', /технолог/]
    ];

    // =========================================================
    // ХРАНИЛИЩЕ И ОБЩИЕ ПОМОЩНИКИ
    // =========================================================

    function lsGet(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; }
    }
    function lsSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) {}
    }
    function lsGetJSON(key) {
      try { return JSON.parse(lsGet(key, '{}')) || {}; } catch (e) { return {}; }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
    function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
    function dayDiff(a, b) { return Math.round((a - b) / 86400000); }

    // Чистит ссылку из таблицы: достаёт адрес из кода <iframe>/<a>, отрезает лишние атрибуты и метки fbclid
    function cleanUrl(raw) {
      let u = String(raw || '').trim();
      if (!u) return '#';
      const attr = u.match(/(?:src|href)\s*=\s*["']([^"']+)["']/i);
      if (attr) u = attr[1];
      const m = u.match(/https?:\/\/[^\s"'<>]+/i);
      if (!m) return '#';
      u = m[0];
      try {
        const url = new URL(u);
        ['fbclid', 'gclid'].forEach(p => url.searchParams.delete(p));
        u = url.toString();
      } catch (e) {}
      return u;
    }

    function youtubeId(url) {
      const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      return m ? m[1] : null;
    }

    function hostOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
    }

    // Текст из таблицы → аккуратный HTML: **жирный**, переносы строк, кликабельные ссылки
    function richText(raw) {
      let s = escapeHtml(raw);
      s = s.replace(/&lt;(\/?)(b|strong|i|em|u|br)\s*\/?&gt;/gi, '<$1$2>');
      s = s.replace(/https?:\/\/[^\s<]+/g, match => {
        const url = match.replace(/[.,;:!?)\]]+$/, '');
        const tail = match.slice(url.length);
        return `<a href="${url}" target="_blank" rel="noopener">${url} ↗</a>${tail}`;
      });
      s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
      s = s.replace(/__([^_\n]+?)__/g, '<b>$1</b>');
      s = s.replace(/\r?\n/g, '<br>');
      return s;
    }

    // ---------- Предметы ----------

    function subjectOf(text) {
      const s = String(text || '').toLowerCase();
      const head = s.replace(/^\s*\d+\.\s*/, '').slice(0, 28);
      for (const [key, re] of SUBJ_RULES) if (re.test(head)) return key;
      for (const [key, re] of SUBJ_RULES) if (re.test(s)) return key;
      return 'other';
    }
    function subjDef(key) { return SUBJECTS[key] || SUBJECTS.other; }
    function subjName(key, short) {
      const d = subjDef(key);
      const v = short ? d.short : d.name;
      return typeof v === 'object' ? v[currentLang] : v;
    }
    // Атрибуты для элемента, окрашенного в цвет предмета
    function subjAttr(key) {
      const d = subjDef(key);
      return `style="--sc:${d.sc};--sc-dark:${d.dark};--sc-ink:${d.ink || d.sc}"`;
    }

    // ---------- Даты ("21.10.2026", "Вторник 21 октомври", "От 09 до 15 ноември") ----------

    const MONTH_STEMS = [
      ['ян', 'jan'], ['фев', 'feb'], ['мар', 'mar'], ['апр', 'apr'], ['май', 'мая', 'may'], ['юн', 'jun'],
      ['юл', 'jul'], ['авг', 'aug'], ['сен', 'сеп', 'sep'], ['окт', 'oct'], ['ное', 'ноя', 'nov'], ['дек', 'dec']
    ];

    function schoolYearFor(month0) {
      const now = new Date();
      const startYear = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
      return month0 >= 8 ? startYear : startYear + 1;
    }

    function findDates(text) {
      const res = [];
      if (!text) return res;
      const t = String(text).toLowerCase();
      let m;
      const numRe = /(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?/g;
      while ((m = numRe.exec(t))) {
        const d = +m[1], mo = +m[2] - 1;
        if (d < 1 || d > 31 || mo < 0 || mo > 11) continue;
        let y = m[3] ? +m[3] : schoolYearFor(mo);
        if (y < 100) y += 2000;
        res.push(new Date(y, mo, d));
      }
      const wordRe = /(\d{1,2})(?:\s*(?:-|–|—|до)\s*(\d{1,2}))?\s+([а-яёa-z]{3,})(?:\s+(\d{4}))?/g;
      while ((m = wordRe.exec(t))) {
        const word = m[3];
        const mo = MONTH_STEMS.findIndex(stems => stems.some(s => word.startsWith(s)));
        if (mo < 0) continue;
        const y = m[4] ? +m[4] : schoolYearFor(mo);
        res.push(new Date(y, mo, +m[1]));
        if (m[2]) res.push(new Date(y, mo, +m[2]));
      }
      return res;
    }

    function formatDayMonth(d) { return `${d.getDate()} ${T().months[d.getMonth()]}`; }
    function weekdayName(d) { return T().weekdays[d.getDay()]; }

    function formatPrettyDate(raw) {
      const d = findDates(raw)[0];
      return d ? formatDayMonth(d) : String(raw || '');
    }

    // Через сколько дней ближайшая годовщина даты "ДД.ММ" или "ДД.ММ.ГГГГ"
    function daysUntilAnnual(dateStr) {
      const parts = String(dateStr || '').split('.');
      if (parts.length < 2) return Infinity;
      const today = startOfToday();
      const d = new Date(today.getFullYear(), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
      if (isNaN(d)) return Infinity;
      if (d < today) d.setFullYear(d.getFullYear() + 1);
      return dayDiff(d, today);
    }

    function isVacationDay(d) {
      return VACATIONS_DATA.some(v => d >= new Date(v.startDate + 'T00:00:00') && d <= new Date(v.endDate + 'T23:59:59'));
    }
    function isSchoolDay(d) {
      const dow = d.getDay();
      return dow !== 0 && dow !== 6 && !isVacationDay(d);
    }
    // До 12:00 — сегодняшний учебный день, после — следующий (с учётом выходных и каникул)
    function getNextSchoolDay() {
      const today = startOfToday();
      const d = new Date(today);
      if (!(new Date().getHours() < 12 && isSchoolDay(d))) {
        d.setDate(d.getDate() + 1);
        for (let i = 0; i < 120 && !isSchoolDay(d); i++) d.setDate(d.getDate() + 1);
      }
      return { date: d, diff: dayDiff(d, today) };
    }

    const DAY_MAP = {
      0: ['неделя', 'воскресенье', 'sunday'],
      1: ['понеделник', 'понедельник', 'monday', 'пн'],
      2: ['вторник', 'tuesday', 'вт'],
      3: ['сряда', 'среда', 'wednesday', 'ср'],
      4: ['четвъртък', 'четверг', 'thursday', 'чт'],
      5: ['петък', 'пятница', 'friday', 'пт'],
      6: ['събота', 'суббота', 'saturday', 'сб']
    };
    function matchesDay(text, dow) {
      const s = String(text || '').toLowerCase();
      return (DAY_MAP[dow] || []).some(k => s.includes(k));
    }
    function dowOfScheduleItem(item) {
      for (let d = 1; d <= 6; d++) if (matchesDay(item.day, d)) return d;
      return matchesDay(item.day, 0) ? 0 : -1;
    }

    let currentLang = lsGet('app_lang', 'ru') === 'bg' ? 'bg' : 'ru';

    let appData = { schedule: [], homework: [], announcements: [], resources: [], events: [], worksheets: [], games: [] };

    // ---------- Домашка: разбор текста и устойчивые ID ----------
    // Разбиение текста не менять — от него зависят ID уже поставленных галочек.
    function parseTextIntoSubjects(text) {
      if (!text) return [{ subj: 'other', text: '' }];
      let parts = text.split(/(?=\d+\.\s*(?:БЕЛ|Бел|Математика|Родинознание|Музика|Изобразително|Технология|Физическо))/g);
      if (parts.length <= 1) parts = [text];
      const res = [];
      parts.forEach(part => {
        const p = part.trim();
        if (p) res.push({ subj: subjectOf(p), text: p });
      });
      return res;
    }

    // Для показа убираем «1. Математика:» в начале — предмет и так виден над заданием
    function displayTaskText(text) {
      let s = String(text || '').replace(/^\s*\d+\.\s*/, '');
      s = s.replace(/^(БЕЛ|Бел|Български език(?: и литература)?|Математика|Мат|Родинознание|Музика|Изобразително изкуство|Изобразително|Технологии и предприемачество|Технологии|Технология|Физическо(?: възпитание и спорт)?|Английски(?: език)?)\s*[:\-–—]\s*/i, '');
      s = s.replace(/^[\s\-–—:]+/, '').replace(/[\s,;]+$/, '');
      return s || String(text || '');
    }

    function dayKey(dayBlock, dayIndex) {
      return String(dayBlock.date || ('d' + dayIndex)).replace(/[^0-9A-Za-zА-Яа-я]+/g, '_');
    }

    function getDayTasks(dayBlock, dayIndex) {
      const tasks = [];
      (dayBlock.items || []).forEach((item, itemIdx) => {
        parseTextIntoSubjects(item.text || item.subject || '').forEach((sub, subIdx) => {
          tasks.push({ id: `hw2_${dayKey(dayBlock, dayIndex)}_${itemIdx}_${subIdx}`, oldId: `hw_${dayIndex}_${itemIdx}_${subIdx}`, sub, dayIndex });
        });
      });
      return tasks;
    }

    // Дни домашки: самые новые сверху
    function homeworkDays() {
      const state = lsGetJSON('hw_completed');
      return (appData.homework || []).map((d, i) => {
        const tasks = getDayTasks(d, i);
        const done = tasks.filter(t => state[t.id]).length;
        return { block: d, index: i, date: findDates(d.date)[0] || null, tasks, done, total: tasks.length, complete: tasks.length > 0 && done === tasks.length };
      }).sort((a, b) => (b.date || 0) - (a.date || 0) || b.index - a.index);
    }

    function migrateHomeworkIds() {
      if (lsGet('hw_ids_v2', '') || !(appData.homework || []).length) return;
      const state = lsGetJSON('hw_completed');
      appData.homework.forEach((day, di) => getDayTasks(day, di).forEach(task => { if (state[task.oldId]) state[task.id] = true; }));
      lsSet('hw_completed', JSON.stringify(state));
      lsSet('hw_ids_v2', '1');
    }

    function toggleTask(id, dayIndex) {
      stopSpeech();
      const state = lsGetJSON('hw_completed');
      const wasDone = !!state[id];
      state[id] = !wasDone;
      lsSet('hw_completed', JSON.stringify(state));

      if (!wasDone) {
        const block = appData.homework[dayIndex];
        const tasks = block ? getDayTasks(block, dayIndex) : [];
        const allDone = tasks.length > 0 && tasks.every(t => state[t.id]);
        if (allDone) launchConfetti(true);
        else if (getMode() === 'kid') launchConfetti(false);
      }
      renderView(currentView);
    }

    function onTaskClick(event, id, dayIndex) {
      if (event.target.closest('a, button')) return;
      toggleTask(id, dayIndex);
    }

    // ---------- Успехи ----------
    const MEDALS = [
      { days: 3, icon: '🥉' },
      { days: 7, icon: '🥈' },
      { days: 15, icon: '🥇' },
      { days: 30, icon: '🏆' }
    ];

    function computeRewards() {
      const days = homeworkDays();
      const stars = days.reduce((s, d) => s + d.done, 0);
      const completedDays = days.filter(d => d.complete).length;
      const today = startOfToday();
      const dated = days.filter(d => d.date);
      let i = 0;
      while (i < dated.length && !dated[i].complete && dated[i].date >= today) i++;
      let streak = 0;
      for (; i < dated.length && dated[i].complete; i++) streak++;
      const earned = MEDALS.filter(m => completedDays >= m.days);
      const next = MEDALS.find(m => completedDays < m.days);
      const prev = earned.length ? earned[earned.length - 1].days : 0;
      const pct = next ? Math.round(((completedDays - prev) / (next.days - prev)) * 100) : 100;
      return { stars, streak, completedDays, earned, next, pct };
    }

    // ---------- Чек-лист портфеля (сам очищается в 15:00) ----------
    function packCycleId() { return new Date(Date.now() - 15 * 3600 * 1000).toDateString(); }

      const cycle = packCycleId();
      if (lsGet('pack_cycle', '') !== cycle) {
        lsSet('pack_cycle', cycle);
        lsSet('pack_completed', '{}');
      }
      return lsGetJSON('pack_completed');

    // ---------- Материалы: листы + ресурсы + игры в одном списке ----------
    const STOP_WORDS = new Set([
      'работен', 'работни', 'материал', 'материали', 'урок', 'урока', 'тема', 'темата', 'пособие', 'видео',
      'игра', 'игри', 'задача', 'задачи', 'упражнение', 'упражнения', 'учебник', 'страница', 'помагало',
      'сборник', 'домашно', 'рабочий', 'ссылка', 'тетрадка', 'тетрадката', 'работа', 'лесно', 'забавно'
    ]);

    function extractLetters(text) {
      const letters = new Set();
      const re = /(?:звук|звукът|буква|буквата)(?:\s*(?:и|\/|,)\s*(?:буква|буквата)?)?\s+([а-яё])\1?(?![а-яё])/gi;
      let m;
      while ((m = re.exec(String(text || '')))) letters.add(m[1].toLowerCase());
      return letters;
    }
    function extractStems(text) {
      const stems = new Set();
      String(text || '').toLowerCase().split(/[^а-яёa-z]+/).forEach(w => {
        if (w.length < 5 || STOP_WORDS.has(w) || /^(звук|буква)/.test(w)) return;
        stems.add(w.slice(0, 5));
      });
      return stems;
    }

    function fileTypeOf(url) {
      if (url.includes('spreadsheets')) return { icon: '📊', name: 'Google Таблица' };
      if (url.includes('presentation')) return { icon: '📽️', name: 'Google Презентация' };
      if (url.includes('forms')) return { icon: '📝', name: 'Google Форма' };
      if (/\.pdf($|\?)/i.test(url)) return { icon: '📑', name: 'PDF' };
      if (url.includes('docs.google.com/document')) return { icon: '📄', name: 'Google Документ' };
      if (url.includes('drive.google.com')) return { icon: '📄', name: 'Google Диск' };
      return { icon: '📄', name: hostOf(url) };
    }

    function buildMaterials() {
      const list = [];
      (appData.worksheets || []).forEach(w => {
        const url = cleanUrl(w.url);
        const ft = fileTypeOf(url);
        list.push({ kind: 'sheet', title: w.title || '', desc: w.description || '', url, emoji: ft.icon, source: ft.name,
          subj: subjectOf(`${w.subject || ''} ${w.title || ''} ${w.description || ''}`), key: 'w:' + url + '|' + (w.title || '') });
      });
      (appData.resources || []).forEach(r => {
        const url = cleanUrl(r.url);
        const yt = youtubeId(url);
        const isVideo = !!yt || /видео|youtube/i.test(r.category || '');
        list.push({ kind: isVideo ? 'video' : 'link', title: r.title || '', desc: r.description || '', url, yt,
          emoji: isVideo ? '▶️' : '🔗', source: isVideo ? 'YouTube' : hostOf(url),
          subj: subjectOf(`${r.title || ''} ${r.category || ''} ${r.description || ''}`), key: 'r:' + url + '|' + (r.title || '') });
      });
      (appData.games || []).forEach(g => {
        const url = cleanUrl(g.url);
        list.push({ kind: 'game', title: g.title || '', desc: g.description || '', url, emoji: '🎮', source: hostOf(url),
          subj: subjectOf(`${g.subject || ''} ${g.title || ''}`), key: 'g:' + url + '|' + (g.title || '') });
      });

      // Одинаковые названия («Работен лист» ×11) получают номер, чтобы их было легко различать
      const counts = {}, seen = {};
      const k = m => m.kind + '|' + m.subj + '|' + m.title.trim().toLowerCase();
      list.forEach(m => { counts[k(m)] = (counts[k(m)] || 0) + 1; });
      list.forEach(m => {
        if (counts[k(m)] > 1) { seen[k(m)] = (seen[k(m)] || 0) + 1; m.num = seen[k(m)]; }
        const text = `${m.title} ${m.desc}`;
        m.letters = extractLetters(text);
        m.stems = extractStems(text);
      });
      return list;
    }

    function matTitle(m) {
      const base = m.title || T().kind[m.kind];
      return m.num ? `${base} ${m.num}` : base;
    }

    function findRelatedMaterials(taskText) {
      const letters = extractLetters(taskText);
      const lower = String(taskText || '').toLowerCase();
      const seen = new Set();
      const found = [];
      MATERIALS.forEach(m => {
        if (seen.has(m.url) || m.url === '#') return;
        let match = false;
        if (m.letters.size) match = [...m.letters].some(l => letters.has(l));
        else if (m.stems.size) match = [...m.stems].some(s => lower.includes(s));
        if (match) { seen.add(m.url); found.push(m); }
      });
      const order = { video: 0, game: 1, link: 2, sheet: 3 };
      return found.sort((a, b) => order[a.kind] - order[b.kind]).slice(0, 6);
    }

    // ---------- Метки «Новое» ----------
    const SECTIONS = {
      news: { items: () => appData.announcements || [], key: a => 'n:' + (a.title || '') + '|' + (a.date || '') },
      materials: { items: () => MATERIALS, key: m => m.key }
    };
    const NEW_KEYS = { news: new Set(), materials: new Set() };
    const VIEWED = new Set();

    function computeNewItems() {
      const seen = lsGetJSON('seen_v1');
      // Перенос из прошлой версии, где листы, ресурсы и игры были отдельно
      if (!Array.isArray(seen.materials) && (seen.worksheets || seen.resources || seen.games)) {
        seen.materials = [].concat(seen.worksheets || [], seen.resources || [], seen.games || []);
      }
      VIEWED.clear();
      Object.keys(SECTIONS).forEach(name => {
        const cfg = SECTIONS[name];
        const keys = cfg.items().map(cfg.key);
        if (!Array.isArray(seen[name])) { seen[name] = keys; NEW_KEYS[name] = new Set(); }
        else { const s = new Set(seen[name]); NEW_KEYS[name] = new Set(keys.filter(x => !s.has(x))); }
      });
      lsSet('seen_v1', JSON.stringify(seen));
      if (SECTIONS[currentView]) markSectionViewed(currentView);
    }

    function markSectionViewed(name) {
      const cfg = SECTIONS[name];
      if (!cfg || !DATA_LOADED) return;
      const seen = lsGetJSON('seen_v1');
      const all = new Set(Array.isArray(seen[name]) ? seen[name] : []);
      cfg.items().forEach(item => all.add(cfg.key(item)));
      seen[name] = [...all];
      lsSet('seen_v1', JSON.stringify(seen));
      VIEWED.add(name);
    }

    function newCount(name) { return VIEWED.has(name) ? 0 : NEW_KEYS[name].size; }

    // ---------- Озвучка ----------
    const TTS_SUPPORTED = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    if (!TTS_SUPPORTED) document.documentElement.classList.add('no-tts');
    const SPEAK_TEXTS = {};
    let speakingId = null;
    if (TTS_SUPPORTED) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function prepareForSpeech(text) {
      return String(text || '')
        .replace(/https?:\/\/\S+/g, '')
        .replace(/\*\*/g, '')
        .replace(/^\s*\d+\.\s*/, '')
        .replace(/стр\./gi, 'страница ')
        .replace(/зад\./gi, 'задача ')
        .replace(/упр\./gi, 'упражнение ')
        .replace(/[–—]/g, ' до ')
        .replace(/\p{Extended_Pictographic}/gu, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function updateSpeakButtons() {
      document.querySelectorAll('[data-speak]').forEach(btn => {
        const on = btn.dataset.speak === speakingId;
        btn.classList.toggle('on', on);
        const ic = btn.querySelector('.speak-ic');
        if (ic) ic.innerHTML = icon(on ? 'stop' : 'volume');
      });
    }

    function stopSpeech() {
      if (TTS_SUPPORTED && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) window.speechSynthesis.cancel();
      speakingId = null;
      updateSpeakButtons();
    }

    function speakTask(id) {
      if (!TTS_SUPPORTED) return;
      const again = speakingId === id;
      stopSpeech();
      if (again) return;
      const text = prepareForSpeech(SPEAK_TEXTS[id]);
      if (!text) return;
      const synth = window.speechSynthesis;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'bg-BG';
      u.rate = 0.85;
      const voice = synth.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('bg'));
      if (voice) u.voice = voice;
      u.onend = u.onerror = () => { if (speakingId === id) { speakingId = null; updateSpeakButtons(); } };
      speakingId = id;
      updateSpeakButtons();
      synth.speak(u);
    }

    function launchConfetti(big) {
      if (typeof confetti !== 'function') return;
      if (big) {
        confetti({ particleCount: 90, spread: 80, origin: { y: 0.6, x: 0.2 } });
        confetti({ particleCount: 90, spread: 80, origin: { y: 0.6, x: 0.8 } });

        confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
      }

    // ---------- Календарь (.ics) ----------
    let ANN_LIST = [];
    let EVENT_LIST = [];

    function icsDate(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
    function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }

    function downloadIcs({ title, start, end, description, yearly }) {
      const endEx = new Date(end || start);
      endEx.setDate(endEx.getDate() + 1);
      const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
      const lines = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Class hub 1B//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        'UID:' + Date.now() + '-' + Math.random().toString(36).slice(2) + '@hub1b',
        'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + icsDate(start),
        'DTEND;VALUE=DATE:' + icsDate(endEx),
        'SUMMARY:' + icsEscape(title)
      ];
      if (description) lines.push('DESCRIPTION:' + icsEscape(description));
      if (yearly) lines.push('RRULE:FREQ=YEARLY');
      lines.push('BEGIN:VALARM', 'TRIGGER:-PT12H', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEscape(title), 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'hub1b-event.ics';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    }

    function addAnnouncementToCalendar(idx) {
      const a = ANN_LIST[idx];
      const dates = a ? findDates(a.endDate || a.date) : [];
      if (!dates.length) return;
      downloadIcs({ title: a.title || '📢', start: new Date(Math.min(...dates)), end: new Date(Math.max(...dates)), description: String(a.text || '').replace(/\*\*/g, '') });
    }
    function addVacationToCalendar(id) {
      const v = VACATIONS_DATA.find(x => x.id === id);
      if (v) downloadIcs({ title: `${v.icon} ${v.title[currentLang]}`, start: new Date(v.startDate + 'T00:00:00'), end: new Date(v.endDate + 'T00:00:00') });
    }
    function addEventToCalendar(idx) {
      const e = EVENT_LIST[idx];
      if (!e) return;
      const days = daysUntilAnnual(e.date);
      if (!isFinite(days)) return;
      const d = startOfToday();
      d.setDate(d.getDate() + days);
      downloadIcs({ title: `${e.icon || '🎂'} ${e.name || ''}`, start: d, end: d, description: e.description || '', yearly: /рожд|birth/i.test(`${e.type || ''} ${e.name || ''}`) });
    }

    // ---------- Поделиться ----------
    function annShareText(a) {
      if (!a) return '';
      return `📢 ${a.title || ''}\n📅 ${a.date || ''}\n\n${String(a.text || '').replace(/\*\*/g, '')}\n\n${location.href.split('#')[0]}`;
    }
    async function shareAnnouncement(idx, btn) {
      const a = ANN_LIST[idx];
      if (!a) return;
      if (navigator.share) {
        try { await navigator.share({ title: a.title || '', text: annShareText(a) }); } catch (e) {}
        return;
      }
      const panel = btn.parentElement.querySelector('.share-panel');
      if (panel) panel.hidden = !panel.hidden;
    }
    async function copyAnnouncement(idx, btn) {
      const text = annShareText(ANN_LIST[idx]);
      try { await navigator.clipboard.writeText(text); }
      catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove();
      }
      btn.textContent = T().copied;
    }

    // ---------- Установка на экран телефона ----------
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (currentView === 'home' || currentView === 'settings') renderView(currentView);
    });
    function isStandalone() {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    }
    async function installApp() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch (e) {}
      deferredInstallPrompt = null;
      renderView(currentView);
    }
    function hideInstallHint() { lsSet('install_hint_hidden', '1'); renderView(currentView); }

    // ---------- Тема, шрифт, язык ----------
    const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function applyTheme() {
      const t = lsGet('ui_theme', 'auto');
      const dark = t === 'dark' || (t === 'auto' && darkMQ && darkMQ.matches);
      document.documentElement.classList.toggle('dark', dark);
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', dark ? '#0A0F1A' : '#F3F5F9');
    }
    if (darkMQ) {
      const onChange = () => { if (lsGet('ui_theme', 'auto') === 'auto') applyTheme(); };
      if (darkMQ.addEventListener) darkMQ.addEventListener('change', onChange); else if (darkMQ.addListener) darkMQ.addListener(onChange);
    }
    function setTheme(t) { lsSet('ui_theme', t); applyTheme(); renderAll(); }
    function setFont(f) { lsSet('ui_font', f); document.documentElement.classList.toggle('font-large', f === 'large'); renderAll(); }
    function setLanguage(lang) {
      currentLang = lang;
      lsSet('app_lang', lang);
      document.documentElement.lang = lang;
      renderAll();
    }

    // ---------- Режим ученика ----------
    function getMode() { return lsGet('ui_mode', 'parent') === 'kid' ? 'kid' : 'parent'; }
    function enterKidMode() {
      lsSet('ui_mode', 'kid');
      document.documentElement.classList.add('kid');
      navigate('kidTasks');
    }
    let GATE_ANSWER = 0;
    function openGate() {
      const t = T();
      const a = 4 + Math.floor(Math.random() * 6);
      const b = 3 + Math.floor(Math.random() * 7);
      GATE_ANSWER = a + b;
      document.getElementById('gateTitle').textContent = t.gateTitle;
      document.getElementById('gateQuestion').textContent = t.gateQ(a, b);
      document.getElementById('gateOk').textContent = t.gateOk;
      document.getElementById('gateCancel').textContent = t.gateCancel;
      document.getElementById('gateErr').textContent = '';
      const input = document.getElementById('gateInput');
      input.value = '';
      document.getElementById('gate').hidden = false;
      setTimeout(() => input.focus(), 50);
    }
    function closeGate() { document.getElementById('gate').hidden = true; }
    function checkGate() {
      const input = document.getElementById('gateInput');
      if (parseInt(input.value, 10) === GATE_ANSWER) {
        closeGate();
        lsSet('ui_mode', 'parent');
        document.documentElement.classList.remove('kid');
        navigate('home');
      } else {
        document.getElementById('gateErr').textContent = T().gateWrong;
        input.value = '';
        input.focus();
      }
    }

    // =========================================================
    // НАВИГАЦИЯ
    // =========================================================
    const KID_VIEWS = ['kidTasks', 'kidPlay', 'kidStars'];
    const NAV = {
      parent: {
        side: ['home', 'homework', 'schedule', 'news', 'materials', 'vacations', 'events', 'settings'],
        bottom: ['home', 'homework', 'schedule', 'news', 'more']
      },
      kid: { side: KID_VIEWS, bottom: KID_VIEWS }
    };
    const NAV_ICON = {
      home: 'home', homework: 'tasks', schedule: 'calendar', news: 'megaphone', materials: 'folder',
      vacations: 'sun', events: 'gift', more: 'grid', settings: 'sliders',
      kidTasks: 'tasks', kidPlay: 'game', kidStars: 'star'
    };
    const MORE_VIEWS = ['more', 'materials', 'vacations', 'events', 'settings'];

    function navBadge(v) {
      if (v === 'news') return newCount('news');
      if (v === 'materials' || v === 'more') return newCount('materials');
      return 0;
    }
    function isNavActive(item) {
      return item === currentView || (item === 'more' && MORE_VIEWS.includes(currentView));
    }
    function defaultView() { return getMode() === 'kid' ? 'kidTasks' : 'home'; }
    function viewAllowed(v) {
      if (!VIEW_RENDER[v]) return false;
      return getMode() === 'kid' ? KID_VIEWS.includes(v) : !KID_VIEWS.includes(v);
    }

    function navigate(v) {
      if (location.hash === '#' + v) applyRoute();
      else location.hash = v;
    }

    function applyRoute() {
      let v = decodeURIComponent(location.hash.slice(1));
      if (!viewAllowed(v)) {
        v = defaultView();
        if (history.replaceState) history.replaceState(null, '', '#' + v);
      }
      const changed = v !== currentView;
      currentView = v;
      stopSpeech();
      document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + v));
      if (SECTIONS[v]) markSectionViewed(v);
      renderView(v);
      renderNav();
      if (changed) window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', applyRoute);

    function renderNav() {
      const t = T();
      const mode = getMode();
      const logo = `<div class="brand-logo">1Б</div>`;

      document.getElementById('sidebar').innerHTML = `
        <div class="brand side-brand">${logo}<div><div>${t.brand}</div><div class="brand-sub">${mode === 'kid' ? t.brandSubKid : t.brandSub}</div></div></div>
        <nav class="side-nav">
          ${NAV[mode].side.map(v => `
            <button class="side-item ${isNavActive(v) ? 'active' : ''}" onclick="navigate('${v}')">
              ${icon(NAV_ICON[v])}<span>${t.nav[v]}</span>
              ${navBadge(v) ? `<span class="badge-count">${navBadge(v)}</span>` : ''}
            </button>`).join('')}
        </nav>
        <div class="side-footer">
          ${mode === 'parent'
            ? `<button class="side-item" onclick="enterKidMode()">${icon('smile')}<span>${t.kidModeTitle}</span></button>`
            : `<button class="side-item" onclick="openGate()">${icon('lock')}<span>${t.parentsBtn}</span></button>`}
          <div class="seg full">
            <button class="${currentLang === 'ru' ? 'on' : ''}" onclick="setLanguage('ru')">RU</button>
            <button class="${currentLang === 'bg' ? 'on' : ''}" onclick="setLanguage('bg')">BG</button>
          </div>
          <div class="side-meta">
            <span>${t.updated}: ${escapeHtml(appData.updatedAt || '—')}</span>
            <button class="icon-btn" style="width:32px;height:32px;border-radius:9px" onclick="forceRefreshData()" title="${t.btnRefresh}" aria-label="${t.btnRefresh}">${icon('refresh', 'sm')}</button>
          </div>
        </div>`;

      document.getElementById('appbar').innerHTML = `
        <div class="brand">${logo}<span>${t.brand}</span></div>
        <div class="appbar-actions">
          ${mode === 'parent'
            ? `<button class="pill-btn" onclick="enterKidMode()">${icon('smile', 'sm')}<span>${t.kidShort}</span></button>
               <button class="icon-btn ${currentView === 'settings' ? 'on' : ''}" onclick="navigate('settings')" aria-label="${t.nav.settings}">${icon('sliders')}</button>`
            : `<button class="pill-btn" onclick="openGate()">${icon('lock', 'sm')}<span>${t.parentsBtn}</span></button>`}
        </div>`;

      document.getElementById('bottomNav').innerHTML = NAV[mode].bottom.map(v => `
        <button class="bn-item ${isNavActive(v) ? 'active' : ''}" onclick="navigate('${v}')" aria-label="${t.nav[v]}">
          <span class="bn-icon">${icon(NAV_ICON[v])}</span>
          <span>${t.nav[v]}</span>
          ${navBadge(v) ? `<span class="bn-badge">${navBadge(v)}</span>` : ''}
        </button>`).join('');

      document.title = `${t.nav[currentView] || ''} · ${t.brand}`;
    }

    // =========================================================
    // ЗАГРУЗКА ДАННЫХ
    // =========================================================
    async function loadData() {
      LOADING = true;
      try {
        const response = await fetch('data.json?v=' + Date.now());
        if (!response.ok) throw new Error('data.json не найден');
        appData = await response.json();
        DATA_LOADED = true;
        LOAD_ERROR = false;
        LAST_LOAD = Date.now();
        migrateHomeworkIds();
        MATERIALS = buildMaterials();
        computeNewItems();
      } catch (error) {
        console.error('Ошибка загрузки:', error);
        LOAD_ERROR = true;
      }
      LOADING = false;
      renderAll();
    }

    async function forceRefreshData() {
      if (LOADING) return;
      LOADING = true;
      renderAll();
      await loadData();
    }

    // Если приложение долго было в фоне — тихо обновляем данные
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && Date.now() - LAST_LOAD > 10 * 60 * 1000 && !LOADING) loadData();
    });

    function renderAll() {
      renderView(currentView);
      renderNav();
    }

    function renderView(v) {
      const fn = VIEW_RENDER[v];
      const el = document.getElementById('view-' + v);
      if (!fn || !el) return;
      el.innerHTML = fn();
    }

    // Общие заглушки для состояний загрузки и ошибки
    function loadingOrError() {
      if (DATA_LOADED) return '';
      if (LOAD_ERROR && !LOADING) {
        return `<div class="empty"><span class="big">⚠️</span>${T().loadError}<br><button class="btn" onclick="forceRefreshData()">${icon('refresh', 'sm')} ${T().btnRefresh}</button></div>`;
      }
      return '<div class="skeleton"></div><div class="skeleton"></div>';
    }

    function pageHead(title, sub, eyebrow, right) {
      return `
        <div class="page-head">
          <div>
            ${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}
            <h1 class="title">${title}</h1>
            ${sub ? `<div class="subtitle">${sub}</div>` : ''}
          </div>
          ${right || ''}
        </div>`;
    }

    // =========================================================
    // ЭКРАНЫ ДЛЯ РОДИТЕЛЕЙ
    // =========================================================

    function lessonRow(name, idx) {
      const key = subjectOf(name);
      return `<li class="lesson subj" ${subjAttr(key)}>
        <span class="num">${idx + 1}</span><span class="bar"></span>
        <span class="name">${escapeHtml(name)}</span><span class="emoji">${subjDef(key).icon}</span>
      </li>`;
    }

    function rewardsCard() {
      const t = T();
      const r = computeRewards();
      return `
        <div class="card">
          <div class="card-head">
            <div class="card-title">${icon('star')} ${t.rewardsTitle}</div>
            <div class="medals-row">${r.earned.map(m => m.icon).join('')}</div>
          </div>
          <div class="stats">
            <div class="stat"><b>⭐ ${r.stars}</b><span>${t.stars}</span></div>
            <div class="stat"><b>🔥 ${r.streak}</b><span>${t.streak}</span></div>
            <div class="stat"><b>✅ ${r.completedDays}</b><span>${t.daysDone}</span></div>
          </div>
          <div style="margin-top:14px">
            <div class="progress-label"><span>${r.next ? t.nextMedal(r.next.icon, r.next.days - r.completedDays) : t.allMedals}</span></div>
            <div class="progress warn"><span style="width:${r.pct}%"></span></div>
          </div>
        </div>`;
    }

    // ---------- Главная ----------
    function viewHome() {
      const t = T();
      const now = new Date();
      const h = now.getHours();
      const greet = h < 12 ? t.greetMorning : h < 18 ? t.greetDay : t.greetEvening;
      const season = [12, 1, 2].includes(now.getMonth() + 1) ? '❄️' : [3, 4, 5].includes(now.getMonth() + 1) ? '🌸' : [6, 7, 8].includes(now.getMonth() + 1) ? '☀️' : '🍂';
      const head = pageHead(`${greet} 👋`, '', `${season} ${cap(weekdayName(now))}, ${formatDayMonth(now)}`);
      if (!DATA_LOADED) return head + loadingOrError();

      const cards = [];
      const today = startOfToday();

      // 1. Следующий учебный день
      const next = getNextSchoolDay();
      const dow = next.date.getDay();
      const wd = weekdayName(next.date);
      const title = next.diff === 0 ? t.homeToday : next.diff === 1 ? t.homeTomorrow : t.homeNextDay(wd);
      const item = (appData.schedule || []).find(s => dowOfScheduleItem(s) === dow);
      const lessons = item ? (item.lessons || []) : [];
      const hasSport = lessons.some(l => subjectOf(l) === 'pe');
      const pack = getPackState();
      const packDone = t.packItems.filter(i => pack[i.id]).length;
      cards.push(`
        <div class="card">
          <div class="card-head">
            <div><div class="card-title">🎒 ${title}</div><div class="card-sub">${cap(wd)}, ${formatDayMonth(next.date)}</div></div>
          </div>
          <div class="stack-lg">
            ${lessons.length ? `<ol class="lessons">${lessons.map(lessonRow).join('')}</ol>` : `<div class="muted small">${t.noLessons}</div>`}
            ${hasSport ? `<div class="notice">👟 ${t.sportReminder}</div>` : ''}
            <div>
              <div class="progress-label"><span>${t.packLabel}</span><span>${packDone} ${t.of} ${t.packItems.length}</span></div>
              <div class="progress"><span style="width:${Math.round(packDone / t.packItems.length * 100)}%"></span></div>
            </div>
            <button class="btn secondary block" onclick="goPack()">${t.btnPack}</button>
          </div>
        </div>`);

      // 2. Последнее задание
      const days = homeworkDays();
      if (days.length) {
        const d = days[0];
        cards.push(`
          <div class="card">
            <div class="card-head">
              <div><div class="card-title">📝 ${t.homeHomework}</div><div class="card-sub">${d.date ? cap(weekdayName(d.date)) + ', ' + formatDayMonth(d.date) : escapeHtml(d.block.date || '')}</div></div>
              ${d.complete ? `<span class="tag success">${t.dayDone}</span>` : ''}
            </div>
            <div class="stack-lg">
              <ul class="mini-tasks">
                ${d.tasks.map(x => {
                  const done = !!lsGetJSON('hw_completed')[x.id];
                  return `<li class="mini-task subj ${done ? 'done' : ''}" ${subjAttr(x.sub.subj)}>
                    <span class="mark">${icon('check', 'sm')}</span><span class="bar"></span>
                    <span class="label">${subjDef(x.sub.subj).icon} ${escapeHtml(subjName(x.sub.subj))}</span></li>`;
                }).join('')}
              </ul>
              <div>
                <div class="progress-label"><span>${d.done} ${t.of} ${d.total}</span></div>
                <div class="progress"><span style="width:${d.total ? Math.round(d.done / d.total * 100) : 0}%"></span></div>
              </div>
              <button class="btn block" onclick="navigate('homework')">${t.btnOpenHw}</button>
            </div>
          </div>`);
      }

      // 3. Новое
      const newRows = [];
      if (newCount('news')) newRows.push({ v: 'news', label: t.nav.news, ic: 'megaphone', n: newCount('news') });
      if (newCount('materials')) newRows.push({ v: 'materials', label: t.nav.materials, ic: 'folder', n: newCount('materials') });
      if (newRows.length) {
        cards.push(`
          <div class="card">
            <div class="card-head"><div class="card-title">🆕 ${t.homeNew}</div></div>
            <div class="stack">
              ${newRows.map(r => `<button class="row-link" onclick="navigate('${r.v}')"><span class="row-emoji">${icon(r.ic)}</span><span class="grow">${r.label}</span><span class="badge-count">+${r.n}</span></button>`).join('')}
            </div>
          </div>`);
      }

      // 4. Скоро
      const up = [];
      const vac = VACATIONS_DATA.find(v => new Date(v.endDate + 'T23:59:59') >= today);
      if (vac) {
        const n = dayDiff(new Date(vac.startDate + 'T00:00:00'), today);
        up.push({ icon: vac.icon, text: n <= 0 ? t.vacNow(vac.title[currentLang]) : t.vacIn(vac.title[currentLang], n), v: 'vacations', sort: Math.max(n, 0) });
      }
      (appData.events || []).forEach(e => {
        const n = daysUntilAnnual(e.date);
        if (n <= 14) up.push({ icon: e.icon || '🎂', text: `${escapeHtml(e.name || '')}`, sub: t.inDays(n), v: 'events', sort: n });
      });
      (appData.announcements || []).forEach(a => {
        const ds = findDates(a.endDate || a.date);
        if (!ds.length) return;
        const last = new Date(Math.max(...ds));
        if (last < today) return;
        up.push({ icon: '📢', text: escapeHtml(a.title || ''), sub: escapeHtml(a.date || ''), v: 'news', sort: Math.max(0, dayDiff(new Date(Math.min(...ds)), today)) });
      });
      if (up.length) {
        up.sort((a, b) => a.sort - b.sort);
        cards.push(`
          <div class="card">
            <div class="card-head"><div class="card-title">📆 ${t.homeUpcoming}</div></div>
            <div class="stack">
              ${up.slice(0, 6).map(u => `
                <button class="row-link" onclick="navigate('${u.v}')">
                  <span class="row-emoji">${u.icon}</span>
                  <span class="grow">${u.text}${u.sub ? `<span class="sub">${u.sub}</span>` : ''}</span>
                  <span class="chev">${icon('chevron', 'sm')}</span>
                </button>`).join('')}
            </div>
          </div>`);
      }

      // 5. Полезное
      const info = [...(Array.isArray(appData.info) ? appData.info : []), ...USEFUL_INFO];
      if (info.length) {
        cards.push(`
          <div class="card">
            <div class="card-head"><div class="card-title">ℹ️ ${t.homeUseful}</div></div>
            <div class="stack">
              ${info.map(i => {
                const href = /^(tel:|mailto:|https?:)/i.test(String(i.url || '')) ? i.url : '';
                const inner = `<span class="row-emoji">${i.icon || 'ℹ️'}</span><span class="grow">${escapeHtml(i.title || '')}<span class="sub">${richText(i.value || '')}</span></span>`;
                return href ? `<a class="row-link" href="${escapeHtml(href)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="row-link">${inner}</div>`;
              }).join('')}
            </div>
          </div>`);
      }

      // 6. Установка на телефон
      if (!isStandalone() && !lsGet('install_hint_hidden', '')) cards.push(`<div class="card">${installBlock(true)}</div>`);

      return head + `<div class="home-grid">${cards.join('')}</div>`;
    }

    function installBlock(withHide) {
      const t = T();
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      return `
        <div class="card-head"><div class="card-title">📲 ${t.installTitle}</div></div>
        <div class="muted small" style="margin-bottom:14px">${isIos ? t.installIos : t.installAndroid}</div>
        <div class="actions" style="margin-top:0">
          ${deferredInstallPrompt ? `<button class="btn sm" onclick="installApp()">${icon('download', 'sm')} ${t.btnInstall}</button>` : ''}
          ${withHide ? `<button class="btn ghost sm" onclick="hideInstallHint()">${t.btnHide}</button>` : ''}
        </div>`;
    }

    function goPack() {
      navigate('schedule');
      setTimeout(() => { const el = document.getElementById('packCard'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 80);
    }

    // ---------- Домашка ----------
    function taskCard(task, state, t) {
      const done = !!state[task.id];
      const text = displayTaskText(task.sub.text);
      SPEAK_TEXTS[task.id] = `${subjName(task.sub.subj)}. ${text}`;
      const related = findRelatedMaterials(task.sub.text);
      return `
        <div class="task subj ${done ? 'done' : ''}" ${subjAttr(task.sub.subj)}>
          <button class="check" onclick="toggleTask('${task.id}', ${task.dayIndex})" aria-pressed="${done}" aria-label="✓">${icon('check', 'sm')}</button>
          <div class="task-body" onclick="onTaskClick(event, '${task.id}', ${task.dayIndex})">
            <div class="task-subj">${subjDef(task.sub.subj).icon} ${escapeHtml(subjName(task.sub.subj))}</div>
            <div class="task-text">${richText(text)}</div>
            ${related.length ? `<div class="related">${related.map(m => `<a class="rel subj" ${subjAttr(m.subj)} href="${m.url}" target="_blank" rel="noopener" title="${escapeHtml(matTitle(m))}">${m.emoji} ${escapeHtml(matTitle(m))}</a>`).join('')}</div>` : ''}
          </div>
          <button class="speak ${speakingId === task.id ? 'on' : ''}" data-speak="${task.id}" onclick="speakTask('${task.id}')" title="${t.speak}" aria-label="${t.speak}"><span class="speak-ic">${icon(speakingId === task.id ? 'stop' : 'volume')}</span></button>

    function viewHomework() {
      const t = T();
      const head = pageHead(t.hwTitle, t.hwSub);
      if (!DATA_LOADED) return head + loadingOrError();

      const state = lsGetJSON('hw_completed');
      const days = homeworkDays().filter(d => HW_FILTER === 'all' || (HW_FILTER === 'active' ? !d.complete : d.complete));

      const filter = `
        <div class="hw-tools">
          <div class="seg">
            ${[['active', t.fActive], ['completed', t.fDone], ['all', t.fAll]].map(([k, l]) =>
              `<button class="${HW_FILTER === k ? 'on' : ''}" onclick="HW_FILTER='${k}'; renderView('homework')">${l}</button>`).join('')}
          </div>
        </div>`;

      let list;
      if (!(appData.homework || []).length) list = `<div class="empty"><span class="big">📭</span>${t.emptyHw}</div>`;
      else if (!days.length) list = `<div class="empty"><span class="big">${HW_FILTER === 'active' ? '🎉' : '⏳'}</span>${HW_FILTER === 'active' ? t.emptyActive : t.emptyCompleted}</div>`;
      else list = days.map(d => `
        <section class="day-group ${d.complete ? 'done' : ''}">
          <div class="day-head">
            <div>
              <div class="day-title">${d.date ? formatDayMonth(d.date) : escapeHtml(d.block.date || '')}</div>
              <div class="day-sub">${d.date ? cap(weekdayName(d.date)) : ''}</div>
            </div>
            <div class="day-prog">${d.complete ? `<span class="tag success">${icon('check', 'sm')} ${t.dayDone}</span>` : `<span>${d.done}/${d.total}</span><div class="progress"><span style="width:${d.total ? Math.round(d.done / d.total * 100) : 0}%"></span></div>`}</div>
          </div>
          ${d.tasks.map(task => taskCard(task, state, t)).join('')}

      return head + filter + `<div class="hw-layout"><div>${list}</div><aside class="hw-aside">${(appData.homework || []).length ? rewardsCard() : ''}</aside></div>`;

    // ---------- Расписание ----------
    function viewSchedule() {
      const t = T();
      const head = pageHead(t.schedTitle, t.schedSub);
      if (!DATA_LOADED) return head + loadingOrError();

      const sched = appData.schedule || [];
      const todayDow = new Date().getDay();
      const next = getNextSchoolDay();
      const nextDow = next.date.getDay();
      const dows = sched.map(dowOfScheduleItem);
      if (SCHED_SEL === null || SCHED_SEL >= sched.length) {
        let idx = dows.indexOf(nextDow);
        if (idx < 0) idx = dows.indexOf(todayDow);
        SCHED_SEL = idx < 0 ? 0 : idx;
      }

      const switcher = sched.length ? `
        <div class="day-switch">
          <div class="seg full">
            ${sched.map((s, i) => `<button class="${SCHED_SEL === i ? 'on' : ''}" onclick="SCHED_SEL=${i}; renderView('schedule')">${dows[i] >= 0 ? t.weekdaysShort[dows[i]] : escapeHtml(String(s.day).slice(0, 3))}</button>`).join('')}
          </div>
        </div>` : '';

      const week = sched.length ? `
        <div class="week">
          ${sched.map((s, i) => {
            const d = dows[i];
            const isToday = d === todayDow && isSchoolDay(startOfToday());
            const isNext = d === nextDow;
            const badge = isNext ? (next.diff === 0 ? t.today : next.diff === 1 ? t.tomorrow : t.nextDay) : isToday ? t.today : '';
            return `
              <div class="card day-col ${SCHED_SEL === i ? 'sel' : ''} ${isNext ? 'today' : ''}">
                <div class="card-head">
                  <div class="card-title">${d >= 0 ? cap(t.weekdays[d]) : escapeHtml(s.day)}</div>
                  ${badge ? `<span class="tag ${isNext ? 'success' : ''}">${badge}</span>` : ''}
                </div>
                <ol class="lessons">${(s.lessons || []).map(lessonRow).join('')}</ol>
                ${(s.lessons || []).some(l => subjectOf(l) === 'pe') ? `<div class="notice" style="margin-top:10px">👟 ${t.sportReminder}</div>` : ''}
              </div>`;
          }).join('')}
        </div>` : `<div class="empty">${t.noLessons}</div>`;

      const pack = getPackState();
      const packCard = `
        <div class="card" id="packCard" style="scroll-margin-top:80px">
          <div class="card-head"><div><div class="card-title">🎒 ${t.packTitle}</div><div class="card-sub">${t.packHint}</div></div></div>
          <div class="check-grid">
            ${t.packItems.map(i => `
              <button class="check-row ${pack[i.id] ? 'done' : ''}" onclick="togglePackItem('${i.id}')" aria-pressed="${!!pack[i.id]}">
                <span class="check">${icon('check', 'sm')}</span><span class="label">${i.text}</span>
              </button>`).join('')}
          </div>
        </div>`;

      return head + switcher + week + packCard;
    }

    // ---------- Новости ----------
    function announcementCard(a, idx, archived) {
      const t = T();
      const raw = a.text || '';
      const important = !archived && (String(a.isImportant).toLowerCase() === 'true' || a.isImportant === true);
      const canCal = !archived && findDates(a.endDate || a.date).length > 0;
      const urls = [...new Set((raw.match(/https?:\/\/[^\s<]+/g) || []).map(u => u.replace(/[.,;:!?)\]]+$/, '')))];
      const previews = urls.map(url => {
        const yt = youtubeId(url);
        return `<a class="preview" href="${url}" target="_blank" rel="noopener">
          ${yt ? `<img src="https://img.youtube.com/vi/${yt}/mqdefault.jpg" alt="" loading="lazy">` : `<span class="p-icon">${icon('link')}</span>`}
          <span style="min-width:0"><span class="p-title">${yt ? t.watchYoutube : t.openLink}</span><span class="p-url">${escapeHtml(url)}</span></span>
        </a>`;
      }).join('');
      const share = encodeURIComponent(annShareText(a));
      return `
        <article class="card ann ${important ? 'important' : ''} ${archived ? 'archived' : ''}">
          <div class="ann-meta">
            ${important ? `<span class="tag danger">${t.important}</span>` : ''}
            <span>${icon('calendar', 'sm')}</span><span>${escapeHtml(a.date || '')}</span>
            ${newChip('news', a)}
          </div>
          <h3 class="ann-title">${escapeHtml(a.title || '')}</h3>
          <div class="rich">${richText(raw)}</div>
          ${previews}
          <div class="actions">
            ${canCal ? `<button class="btn ghost sm" onclick="addAnnouncementToCalendar(${idx})">${icon('calendarPlus', 'sm')} ${t.btnCalendar}</button>` : ''}
            <button class="btn ghost sm" onclick="shareAnnouncement(${idx}, this)">${icon('share', 'sm')} ${t.btnShare}</button>
            <div class="share-panel" hidden>
              <a class="btn sm wa" href="https://wa.me/?text=${share}" target="_blank" rel="noopener">WhatsApp</a>
              <a class="btn sm viber" href="viber://forward?text=${share}">Viber</a>
              <button class="btn secondary sm" onclick="copyAnnouncement(${idx}, this)">${icon('copy', 'sm')} ${t.copyText}</button>
            </div>
          </div>
        </article>`;
    }

    function viewNews() {
      const t = T();
      const head = pageHead(t.newsTitle, t.newsSub);
      if (!DATA_LOADED) return head + loadingOrError();
      ANN_LIST = appData.announcements || [];
      if (!ANN_LIST.length) return head + `<div class="empty narrow"><span class="big">📭</span>${t.emptyAnnounce}</div>`;

      const today = startOfToday();
      const active = [], archived = [];
      ANN_LIST.forEach((a, idx) => {
        const ds = findDates(a.endDate || a.date);
        const last = ds.length ? new Date(Math.max(...ds)) : null;
        (last && last < today ? archived : active).push({ a, idx });
      });

      return head + `<div class="narrow">
        <div class="news-list">${active.length ? active.map(x => announcementCard(x.a, x.idx, false)).join('') : `<div class="empty">${t.emptyAnnounce}</div>`}</div>
        ${archived.length ? `
          <details class="archive">
            <summary><span>📦 ${t.archiveTitle} (${archived.length})</span><span class="chev">${icon('chevron', 'sm')}</span></summary>
            <div class="news-list">${archived.map(x => announcementCard(x.a, x.idx, true)).join('')}</div>
          </details>` : ''}
      </div>`;
    }

          <span class="mat-icon">${m.yt ? `<img src="https://img.youtube.com/vi/${m.yt}/mqdefault.jpg" alt="" loading="lazy"><span class="play">${icon('play', 'sm')}</span>` : m.emoji}</span>
          <span class="mat-body">

            <span class="mat-meta"><span class="dot"></span><span>${escapeHtml(subjName(m.subj, true))} · ${T().kind[m.kind]}${m.source ? ' · ' + escapeHtml(m.source) : ''}</span></span>

          <span class="mat-go">${icon('external', 'sm')}</span>
        </a>`;

    function filteredMaterials() {
      const q = MAT.q.trim().toLowerCase();
      return MATERIALS.filter(m =>
        (MAT.type === 'all' || m.kind === MAT.type) &&
        (MAT.subj === 'all' || m.subj === MAT.subj) &&

      const el = document.getElementById('matList');

    function viewMaterials() {
      const t = T();
      if (!DATA_LOADED) return pageHead(t.matTitle) + loadingOrError();
      const head = pageHead(t.matTitle, t.matSub(MATERIALS.length));
      if (!MATERIALS.length) return head + `<div class="empty"><span class="big">📂</span>${t.emptyMaterials}</div>`;

      const types = [['all', t.typeAll], ['sheet', t.typeSheet], ['video', t.typeVideo], ['link', t.typeLink], ['game', t.typeGame]]

      MATERIALS.forEach(m => { subjCounts[m.subj] = (subjCounts[m.subj] || 0) + 1; });
